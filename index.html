<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Running Art</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* 深色（預設）與淺色主題都用這組變數，只有 body.light 覆寫。 */
  :root{
    /* color-scheme 讓原生控制項（拉桿、捲軸）跟著主題，而不是跟著作業系統。
       少了它，淺色主題下的 range 拉桿在深色系統上會是深色的。 */
    color-scheme:dark;
    --bg:#262a30; --panel:#14171c; --panel2:#171b21; --panel3:#0f1216;
    --border:#262b33; --border2:#3a4048;
    --text:#e8eaed; --text2:#c9cdd3; --dim:#8b929c;
    --glass:rgba(20,23,28,.9); --scrim:rgba(6,8,11,.72);
    /* CARTO dark_all 的道路偏暗，提亮讓街道看得清楚 */
    --tile-filter:brightness(2.3) contrast(0.92);

    /* ---- 配色「電光 · 青檸」----
       這裡是唯一的來源：地圖圖層、Canvas 匯出、UI 全部讀這組變數
       （JS 端用 PC() 讀出來，換主題時才重新取一次）。要換配色只改這兩塊。
       原則：進度用明度階（done 亮／pending 暗）而不是兩個不相干的色相；
       整組只留一個高彩度色，給「當下位置」相關的東西。 */
    --rt-done:#B8FF3C;        /* 已跑過的路線 */
    --rt-pending:#6E7A88;     /* 還沒跑到的路線。實測提亮後的圖磚街道亮度 p85≈43，
                                 原本的 #374049 只有 1.34:1 對比會融進地圖，這個是 3.24:1 */
    --rt-connector:#FFFFFF;   /* 連接段虛線：深色底圖上用白色最清楚 */
    --rt-draw:#E8EEF4;        /* 正在畫的手繪線（地圖上，要顯眼） */
    --rt-guide:#59636F;       /* 產生路線後透出來的手繪線（要退到背景） */
    --rt-arrow:#FFFFFF;       /* 方向箭頭 */
    --rt-runner:#FFFFFF;      /* 小人本體 */
    --rt-runner-out:#10151A;  /* 小人外框：壓在亮色路線上要用暗色才看得出來 */
    --rt-start:#B8FF3C;
    --rt-finish:#FFFFFF;
    --rt-elev:#B8FF3C;        /* 高程折線（已跑） */
    --rt-elev-dim:#4A5560;    /* 高程折線（未跑） */
    --rt-node:#8A94A0;        /* 微調模式：一般節點 */
    --rt-node-turn:#FFFFFF;   /* 微調模式：轉彎點 */
    --rt-node-sel:#FF4D5E;    /* 微調模式：已選取（紅＝要刪掉，語意色不換） */
    --rt-ui:#B8FF3C;          /* 介面主色 */
    --rt-ui-text:#111806;     /* 疊在主色上的文字 */
    --rt-on-accent:#10151A;   /* 疊在任何強調色填色上的圖形（圖釘符號、外框） */
  }
  body.light{
    color-scheme:light;
    --bg:#eef1f5; --panel:#ffffff; --panel2:#eef1f6; --panel3:#e6eaf0;
    --border:#d3d9e2; --border2:#c2cad6;
    --text:#1a1d22; --text2:#3a4048; --dim:#6b727d;
    --glass:rgba(255,255,255,.9); --scrim:rgba(30,40,55,.45);
    --tile-filter:none;   /* light_all 底圖本來就亮，不用再提 */

    /* 淺色底圖不是把深色反過來就好：近白的路線在淺地圖上會直接消失，
       所以明度階整個翻面（已跑變深、未跑變淺），強調色也要壓深才有對比。 */
    --rt-done:#4D7C0F;
    --rt-pending:#B6C0CB;
    --rt-connector:#8A94A0;
    --rt-draw:#1A2029;
    --rt-guide:#98A2AE;
    --rt-arrow:#1F2937;
    --rt-runner:#1F2937;
    --rt-runner-out:#FFFFFF;
    --rt-start:#4D7C0F;
    --rt-finish:#1F2937;
    --rt-elev:#4D7C0F;
    --rt-elev-dim:#AEB8C4;
    --rt-node:#6B7684;
    --rt-node-turn:#1F2937;
    --rt-node-sel:#E11D48;
    --rt-ui:#4D7C0F;
    --rt-ui-text:#FFFFFF;
    --rt-on-accent:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--text)}
  #map{position:absolute;inset:0;background:var(--bg)}
  .leaflet-container{background:var(--bg)}
  .leaflet-tile-pane{filter:var(--tile-filter)}

  /* ---- 頂部 ---- */
  .top{position:absolute;top:0;left:0;right:0;z-index:500;padding:10px 12px;
    display:flex;gap:8px;align-items:center;pointer-events:none}
  .top>*{pointer-events:auto}
  .brand{font-size:15px;font-weight:700;letter-spacing:.5px;
    background:var(--glass);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:10px;padding:8px 12px}
  .btn-dl{display:flex;align-items:center;gap:6px;
    background:var(--glass);backdrop-filter:blur(8px);
    border:1px solid var(--border);color:var(--text);border-radius:10px;
    padding:9px 13px;font-size:13px;font-weight:500}
  .btn-dl.push{margin-left:auto}
  .btn-dl.on{background:var(--rt-ui);border-color:var(--rt-ui);color:var(--rt-ui-text)}
  /* 圖示按鈕鎖死 38×38，內容置中：不管裝 SVG 或「EN」/「中」文字，大小都一致
     （拉丁字母與 CJK 行高不同，不鎖高度會讓語言按鈕看起來忽大忽小） */
  .icon-btn{flex:none;width:38px;height:38px;padding:0;justify-content:center;line-height:1}
  /* 載入地圖是主要入口，給強調色邊框凸顯 */
  #btnDl{border:1.6px solid var(--rt-ui);height:38px}
  .icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}

  /* ---- 引導條 ---- */
  .guide{position:absolute;left:12px;right:12px;bottom:150px;z-index:500;
    background:var(--glass);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-left:3px solid var(--rt-ui);border-radius:10px;
    padding:11px 13px;display:flex;gap:10px;align-items:center;
    transition:opacity .25s,transform .25s}
  .guide.hide{opacity:0;transform:translateY(6px);pointer-events:none}
  .guide .n{width:21px;height:21px;flex:none;border-radius:50%;background:var(--rt-ui);
    color:var(--rt-ui-text);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .guide p{margin:0;font-size:13px;line-height:1.45;color:var(--text2)}
  .guide b{color:var(--text);font-weight:500}

  /* ---- 底部工具列 ---- */
  .dock{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;
    background:var(--glass);backdrop-filter:blur(12px);
    border:1px solid var(--border);border-radius:16px;padding:8px;
    display:flex;flex-direction:column;gap:8px}
  .modes{display:flex;gap:6px}
  .m{flex:1;background:transparent;border:0;border-radius:11px;padding:9px 4px;
    color:var(--dim);font-size:11px;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:4px}
  .m svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .m.on{background:var(--rt-ui);color:var(--rt-ui-text)}
  .m:disabled{opacity:.32}
  .row2{display:flex;gap:6px}
  .sm{background:var(--panel2);border:1px solid var(--border);border-radius:11px;
    color:var(--text2);font-size:12.5px;font-family:inherit;padding:10px 12px;
    display:flex;align-items:center;gap:5px}
  .sm svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .sm:disabled{opacity:.32}
  .go{flex:1;justify-content:center;background:var(--rt-ui);border-color:var(--rt-ui);
    color:var(--rt-ui-text);font-weight:600;font-size:14px}
  .go:disabled{background:var(--panel2);border-color:var(--border);color:var(--dim)}
  /* 微調路徑工具列。這排壓在半透明的 dock 上，用 --panel2 幾乎看不出邊界，
     所以這裡改用更實的底色 + 明顯的框線，讓它讀得出來是按鈕。 */
  .dock[hidden]{display:none}
  #editDock .sm{flex:1;justify-content:center;background:var(--panel3);
    border:1.5px solid var(--border2);color:var(--text);font-weight:600;
    font-size:13px;padding:11px 10px}
  #editDock .sm svg{width:17px;height:17px}
  #editDock .sm:hover:not(:disabled){border-color:var(--rt-ui)}
  #editDock .sm:disabled{opacity:.4}
  .sm.on{background:var(--rt-ui);border-color:var(--rt-ui);color:var(--rt-ui-text)}
  .sm.danger{background:#dc2626;border-color:#dc2626;color:#fff;font-weight:500}
  .sm.danger:disabled{background:var(--panel2);border-color:var(--border);color:var(--dim)}

  /* ---- 恢復結果按鈕 / 距離膠囊（移至工具列上方） ---- */
  .pill{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);z-index:550;
    background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--border);
    border-radius:999px;padding:7px 18px;font-size:13px;font-weight:500;
    transition:opacity .2s, transform .2s, background .2s;white-space:nowrap}
  .pill.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(8px)}
  .pill.tap{background:var(--rt-ui);border-color:var(--rt-ui);color:var(--rt-ui-text);cursor:pointer;
    box-shadow:0 4px 14px rgba(37,99,235,.4)}

  /* ---- 結果面板 ---- */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:600;
    background:var(--panel);border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;padding:14px 20px 18px;
    transform:translateY(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-sizing:border-box;overflow-x:hidden}
  .sheet.up{transform:translateY(0)}
  .grip{width:34px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 12px}

  /* 四大群組由左至右：Group 1 -> Group 3 -> Group 2 -> Group 4，寬度展延且底部齊平對齊 */
  .sheet-content{display:flex;gap:12px;align-items:stretch;width:100%;box-sizing:border-box}

  /* 群組 1：數據 4 框與配速框 */
  .grp-1{flex:1.1 1 270px;display:flex;flex-direction:column;gap:8px;min-width:0;justify-content:space-between}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1 1 auto}
  .stat{background:var(--panel2);border-radius:11px;padding:8px 10px;min-width:0;
    display:flex;flex-direction:column;justify-content:center}
  .stat span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat b{font-size:15px;font-weight:600;white-space:nowrap;display:inline-block}

  /* 配速框：配速按鈕放在速度文字右側 */
  .pace{background:var(--panel2);border-radius:11px;padding:8px 10px;
    display:flex;flex-direction:column;justify-content:center;gap:3px;flex:0 0 auto}
  .pace .lbl{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap}
  .pace .pace-main{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pace .pval-row{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
  .pace .pval-row b{font-size:16px;font-weight:600}
  .pace .pval-row .unit{font-size:11px;color:var(--dim)}
  .pace .pbtn-row{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .pace .pbtn-row button{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel3);color:var(--text);font-size:16px;font-family:inherit;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer}

  /* 群組 3：路線預覽 ＝ 高程變化圖。
     兩者本來就共用同一個進度值和同一條「距離」橫軸，所以直接把高程圖當成拉桿：
     在圖上拖曳就等於拖時間軸。少一列高度，而且 58px 高的圖比 18px 的拉桿鈕好按太多。 */
  .grp-3{flex:1.5 1 340px;display:flex;flex-direction:column;gap:8px;min-width:0;justify-content:center}
  .pv-row{display:flex;align-items:center;gap:10px;min-width:0}
  .pv-info{display:flex;align-items:baseline;gap:6px;flex:0 0 auto;white-space:nowrap}
  .pv-info b{font-size:14px;font-weight:600;white-space:nowrap}
  .pv-info .unit{font-size:11.5px;color:var(--dim);white-space:nowrap}
  /* 最高／最低推到最右邊，和左邊的距離讀數分開 */
  #elevRangeText{margin-left:auto;font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap}
  #pvPlay{flex:0 0 36px;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel3);color:var(--text);font-size:14px;font-family:inherit;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  @media (max-width:420px){
    #elevRangeText{font-size:11px}
  }

  /* 高程折線圖 (Elevation Profile Chart) - 對齊預覽拉桿兩側且文字不換行 */
  .elev-box{background:var(--panel2);border-radius:11px;padding:8px 14px;
    display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 auto;justify-content:center}
  /* 標題單獨一行、靠左上，和其他面板一致 */
  .elev-box .elev-head{font-size:12px;color:var(--dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  /* 這塊就是拉桿本體。touch-action:none 一定要有，否則手機上在圖上拖曳會
     被當成捲動結果面板，根本拖不動跑者。 */
  #elevChartArea{position:relative;width:100%;height:76px;margin:4px 0 6px;box-sizing:border-box;
    min-width:0;cursor:pointer;touch-action:none;border-radius:6px;
    -webkit-user-select:none;user-select:none}
  #elevChartArea:focus-visible{outline:2px solid var(--rt-ui);outline-offset:2px}
  .elev-chart-svg{width:100%;height:100%;display:block;overflow:visible}
  /* 沒有高程資料時（API 失敗）仍要能拖：退化成一條純軌道，不能整塊消失 */
  .elev-track{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;
    border-radius:3px;background:var(--rt-pending);opacity:1}
  .elev-track-run{position:absolute;left:0;top:0;bottom:0;width:0;
    border-radius:3px;background:var(--rt-done);opacity:1}
  /* 高低點與標籤故意「不」畫在 SVG 裡：那個 viewBox 是 preserveAspectRatio="none"，
     實測橫向被拉伸 2 倍，<circle> 會變成扁橢圓、文字也被拉寬。改用百分比定位的
     HTML 疊層，字和圓點都不會變形，而且百分比會自己跟著寬度變化不必重畫。 */
  .elev-pt{position:absolute;width:9px;height:9px;border-radius:50%;box-sizing:border-box;
    transform:translate(-50%,-50%);pointer-events:none;z-index:9}
  .elev-pt.max{background:var(--rt-elev);border:2px solid var(--panel2);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--rt-elev) 55%,transparent)}
  .elev-pt.min{background:var(--rt-elev-dim);border:2px solid var(--panel2);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--rt-elev-dim) 55%,transparent)}
  /* 不要底色墊片——那會擋住底下的高程折線。改用同底色的細描邊（光暈）把字襯出來：
     只吃掉字筆畫周圍 1px，折線幾乎完整看得見，字又不會糊在線上。 */
  .elev-lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
    font-size:9.5px;font-weight:700;line-height:1;pointer-events:none;z-index:11;
    text-shadow:0 0 2px var(--panel2),0 0 2px var(--panel2),0 0 3px var(--panel2),
                0 1px 1px var(--panel2),0 -1px 1px var(--panel2)}
  .elev-lbl.max{color:var(--rt-elev)}
  .elev-lbl.min{color:var(--text2)}
  /* 跑者藍點縮小 50% (9px x 9px 完美正圓) */
  #elevRunnerDot{position:absolute;width:9px;height:9px;border-radius:50%;
    background:var(--rt-runner);border:1.5px solid var(--rt-runner-out);box-shadow:0 1px 3px rgba(0,0,0,.4);
    transform:translate(-50%,-50%);pointer-events:none;transition:left 0.05s, top 0.05s;z-index:10}

  /* 群組 2：微調與編輯四按鈕 (2x2) */
  .grp-2{flex:1 1 180px;display:flex;flex-direction:column;justify-content:stretch;min-width:0}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0;height:100%}
  .tools button{background:var(--panel2);border:1px solid var(--border2);border-radius:11px;
    color:var(--text);font-size:13.5px;font-weight:600;font-family:inherit;padding:10px 6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;white-space:nowrap;cursor:pointer;height:100%}
  .tools button:hover:not(:disabled){border-color:var(--rt-ui);color:var(--text)}
  .tools svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .tools button:disabled{opacity:.32}

  /* 群組 4：下載按鈕（下載圖片在上、下載 GPX 在下） */
  .grp-4{flex:0.9 1 145px;display:flex;flex-direction:column;gap:8px;justify-content:stretch;min-width:0}
  .grp-4 button{flex:1;padding:11px 12px;border-radius:11px;font-size:15px;
    font-family:inherit;font-weight:700;border:1px solid var(--rt-ui);
    display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;height:calc(50% - 4px)}
  /* 下載圖片和下載 GPX 是同一類動作（把成果帶走），所以用同一種樣式 */
  .grp-4 .exp,.grp-4 .pri{background:var(--rt-ui);color:var(--rt-ui-text)}
  .grp-4 svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}

  @media (max-width:960px){
    .sheet-content{flex-direction:column;gap:10px}
    .grp-1, .grp-3, .grp-2, .grp-4{width:100%;flex:none}
    .grp-4{flex-direction:row;gap:8px}
  }

  /* ---- 匯出圖片對話框 ----
     這整區的樣式曾經整批遺失，害得 .modal 是 position:static 沒有 z-index，
     被 position:absolute 的 #map 整片蓋住 → 按「下載圖片」看起來完全沒反應。
     動這裡之前先確認 .modal 仍然是 fixed/absolute + z-index。 */
  .modal{position:absolute;inset:0;z-index:900;background:var(--scrim);
    display:flex;align-items:center;justify-content:center;padding:16px}
  .modal[hidden]{display:none}
  .mbox{width:100%;max-width:720px;max-height:calc(100vh - 32px);overflow-y:auto;
    background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
  .mtitle{font-size:15px;font-weight:600;margin-bottom:12px}
  .mcols{display:flex;gap:16px;align-items:flex-start}
  .mopts{flex:1 1 300px;min-width:0}
  .mprevwrap{flex:0 0 264px;display:flex;align-items:flex-start;justify-content:center;
    background:var(--panel3);border:1px solid var(--border);border-radius:12px;padding:10px}
  /* 透明底圖（去背 PNG）在單色面板上看不出來，用棋盤格襯底才看得出哪裡是透明 */
  .mprev{width:100%;max-width:244px;height:auto;display:block;border-radius:8px;
    background-color:#9aa3ad;
    background-image:linear-gradient(45deg,#7d858e 25%,transparent 25%,transparent 75%,#7d858e 75%),
                     linear-gradient(45deg,#7d858e 25%,transparent 25%,transparent 75%,#7d858e 75%);
    background-size:16px 16px;background-position:0 0,8px 8px}
  .rlabel{font-size:11.5px;color:var(--dim);margin:2px 2px 6px}
  .ratios{display:flex;gap:6px;margin-bottom:12px}
  .ratios.lyrs{flex-wrap:wrap}
  .rt{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:11px;
    color:var(--text2);font-size:13.5px;font-weight:500;font-family:inherit;padding:9px 2px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:pointer;white-space:nowrap;min-width:0}
  .rt i{font-style:normal;font-size:10.5px;color:var(--dim);font-weight:400}
  .rt.on{background:var(--rt-ui);border-color:var(--rt-ui);color:var(--rt-ui-text)}
  .rt.on i{color:rgba(255,255,255,.82)}
  .lyrs .rt{flex:1 1 28%;font-size:12.5px;padding:8px 4px}
  .mprog{width:100%;margin:2px 0 0;-webkit-appearance:none;appearance:none;height:6px;
    border-radius:3px;background:linear-gradient(to right,var(--rt-done) 0%,var(--rt-pending) 0%);
    outline:none;display:block}
  .mprog::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;
    border-radius:50%;background:var(--rt-done);border:2px solid var(--rt-on-accent);
    box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;margin-top:-6px;box-sizing:border-box}
  .mprog::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--rt-done);
    border:2px solid var(--rt-on-accent);box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;box-sizing:border-box}
  .mact{display:flex;gap:8px;margin-top:14px}
  .mact button{flex:1;padding:11px;border-radius:11px;font-size:13.5px;font-family:inherit;
    font-weight:500;border:1px solid var(--border);background:var(--panel2);color:var(--text);
    cursor:pointer;white-space:nowrap}
  .mact .pri{background:var(--rt-ui);border-color:var(--rt-ui);color:var(--rt-ui-text)}
  .mact button:disabled{opacity:.4}
  /* 產生完成後的圖片預覽（給 Safari／手機長按儲存用） */
  .mshot{display:block;width:100%;max-width:300px;margin:0 auto;border-radius:10px;
    border:1px solid var(--border)}
  .mhint{font-size:11.5px;color:var(--dim);margin:10px 2px 0;line-height:1.5}
  @media (max-width:680px){
    .mbox{padding:14px}
    .mcols{flex-direction:column-reverse;gap:12px}
    .mprevwrap{flex:none;width:100%}
    .mprev{max-width:190px}
    .mshot{max-width:210px}
  }

  .toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:900;
    background:var(--glass);border:1px solid var(--border);border-radius:12px;color:var(--text);
    padding:15px 20px;font-size:13.5px;text-align:center;opacity:0;
    transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .busy{position:absolute;top:0;left:0;right:0;z-index:800;display:none;
    align-items:center;gap:9px;justify-content:center;padding:10px;color:var(--text);
    background:var(--glass);border-bottom:1px solid var(--border);font-size:13px}
  .busy.on{display:flex}
  .spin{width:14px;height:14px;border:2px solid var(--rt-ui);border-top-color:transparent;
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .box{position:absolute;border:2px dashed var(--rt-ui);
    background:color-mix(in srgb,var(--rt-ui) 16%,transparent);
    z-index:450;pointer-events:none;border-radius:4px}

  /* ==== 桌面版與大螢幕 ==== */
  @media (min-width:900px){
    .dock{left:50%;transform:translateX(-50%);right:auto;width:auto;max-width:680px}
    .sheet{left:50%;right:auto;width:calc(100vw - 36px);max-width:1380px;transform:translateX(-50%) translateY(102%);
      max-height:calc(100vh - 80px);overflow-y:auto;box-sizing:border-box;padding:14px 20px 18px}
    .sheet.up{transform:translateX(-50%) translateY(0)}
  }
</style>
</head>

<!-- 帶版本參數，否則改了 engine.js 瀏覽器仍會沿用快取的舊引擎 -->
<script src="engine.js?v=20260726a"></script>
<script>
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([25.0610,121.5330],16);

/* ---------- 深／淺色主題 ---------- */
// 底圖跟著換：深色用 CARTO dark_all，淺色用 light_all。
const TILE_URL=t=>`https://{s}.basemaps.cartocdn.com/${t?'light_all':'dark_all'}/{z}/{x}/{y}{r}.png`;
let baseLayer=null, areaMask=null, areaRect=null;
function isLight(){return document.body.classList.contains('light');}

/* ---------- 配色 ----------
   顏色只定義在 CSS 的 --rt-* 變數裡（見檔頭），這裡把它讀出來給 Canvas 和 Leaflet 用，
   免得同一個顏色在 CSS 和 JS 各寫一份、改配色時漏掉一邊。
   getComputedStyle 不便宜，所以快取起來，只在換主題時失效重讀。 */
const RT_KEYS=['done','pending','connector','draw','guide','arrow','runner','runner-out',
               'start','finish','elev','elev-dim','node','node-turn','node-sel',
               'ui','ui-text','on-accent'];
let _pal=null;
function PC(){
  if(!_pal){
    const cs=getComputedStyle(document.body);
    _pal={};
    RT_KEYS.forEach(k=>{ _pal[k]=cs.getPropertyValue('--rt-'+k).trim()||'#888'; });
  }
  return _pal;
}
function palInvalidate(){ _pal=null; }
/* #RRGGBB → rgba(...)。Canvas 的漸層要帶透明度，但配色是用 hex 存的。 */
function hexA(hex,a){
  const h=(hex||'').trim().replace('#','');
  if(h.length<6) return 'rgba(128,128,128,'+a+')';
  return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','
         +parseInt(h.slice(4,6),16)+','+a+')';
}

/* ---------- 方向箭頭造型 ----------
   幾何只寫一次，地圖的 SVG 圖示和匯出的 Canvas 都從這裡長出來——
   以前兩邊各寫一份，結果地圖是青色的 >、匯出卻是金色的，形狀和顏色都對不起來。
   座標是正規化的：箭頭指向 +X，大致落在 ±1 之內，實際大小由 base 決定。
   w 是描邊粗細，同樣以 base 為單位。 */
const ARROW_STYLES={
  chevron:{ name:'單箭頭', en:'Chevron', shapes:[
    {pts:[[-0.70,-0.70],[0.70,0],[-0.70,0.70]], closed:false, mode:'stroke', w:0.42}]},
  double:{ name:'雙箭頭', en:'Double', shapes:[
    {pts:[[-0.98,-0.60],[-0.20,0],[-0.98,0.60]], closed:false, mode:'stroke', w:0.34},
    {pts:[[-0.05,-0.60],[0.73,0],[-0.05,0.60]], closed:false, mode:'stroke', w:0.34}]},
  triangle:{ name:'實心三角', en:'Triangle', shapes:[
    {pts:[[-0.55,-0.76],[0.86,0],[-0.55,0.76]], closed:true, mode:'fill'}]},
  dart:{ name:'後掠飛鏢', en:'Dart', shapes:[
    {pts:[[0.95,0],[-0.72,-0.84],[-0.34,0],[-0.72,0.84]], closed:true, mode:'fill'}]},
  streak:{ name:'速度尾線', en:'Streak', shapes:[
    {pts:[[-0.22,-0.66],[0.64,0],[-0.22,0.66]], closed:false, mode:'stroke', w:0.40},
    {pts:[[-1.02,0],[-0.56,0]], closed:false, mode:'stroke', w:0.26}]}
};
/* 轉角圓角半徑（正規化單位，箭頭本身大約 ±1）。
   小 = 銳利。用「幾何上把轉角換成一段二次貝茲」來做，而不是靠 lineJoin:'round'
   —— 後者的圓角半徑等於線寬的一半，改不動，箭頭尖端會鈍掉。 */
let arrowRadius=parseFloat(localStorage.getItem('runart_arrow_r'));
if(!(arrowRadius>=0)) arrowRadius=0.10;

let arrowStyle=localStorage.getItem('runart_arrow')||'dart';
if(!ARROW_STYLES[arrowStyle]) arrowStyle='dart';

/* 把折點換成小圓角。回傳一串 {t:'M'|'L'|'Q'|'Z'} 指令，
   Canvas 和 SVG 共用同一份結果，兩邊才不會長得不一樣。
   開放折線的頭尾不倒角（那是端點不是轉角）。 */
function arrowGeom(shape,r){
  const pts=shape.pts, n=pts.length, closed=!!shape.closed, out=[];
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
  const len=v=>Math.hypot(v[0],v[1])||1e-9;
  const at=(b,v,k)=>[b[0]+v[0]/len(v)*k, b[1]+v[1]/len(v)*k];
  let started=false;
  for(let i=0;i<n;i++){
    const B=pts[i];
    const corner=closed || (i>0 && i<n-1);
    if(!corner){ out.push({t:started?'L':'M',p:B}); started=true; continue; }
    const A=pts[(i-1+n)%n], C=pts[(i+1)%n];
    const vA=sub(A,B), vC=sub(C,B);
    const d=Math.min(r, len(vA)/2, len(vC)/2);
    out.push({t:started?'L':'M', p:at(B,vA,d)}); started=true;
    out.push({t:'Q', c:B, p:at(B,vC,d)});
  }
  if(closed) out.push({t:'Z'});
  return out;
}
function arrowShapes(){ return (ARROW_STYLES[arrowStyle]||ARROW_STYLES.chevron).shapes; }
function arrowSVGPath(shape,r){
  return arrowGeom(shape,r).map(g=>
    g.t==='Z' ? 'Z'
    : g.t==='Q' ? `Q ${g.c[0].toFixed(4)} ${g.c[1].toFixed(4)} ${g.p[0].toFixed(4)} ${g.p[1].toFixed(4)}`
    : `${g.t} ${g.p[0].toFixed(4)} ${g.p[1].toFixed(4)}`).join(' ');
}


// 地圖上的箭頭圖示：viewBox 用正規化座標，所以 d 不用重算，換大小只改 size
function arrowIcon(dir,size){
  const s=size||26, col=PC().arrow;
  const inner=arrowShapes().map(sh=>{
    const d=arrowSVGPath(sh,arrowRadius);
    return sh.mode==='fill'
      ? '<path d="'+d+'" fill="'+col+'" stroke="'+col+'" stroke-width="0.08" stroke-linejoin="miter"/>'
      : '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+sh.w+'"'
        +' stroke-linecap="round" stroke-linejoin="miter"/>';
  }).join('');
  return L.divIcon({className:'',iconSize:[s,s],iconAnchor:[s/2,s/2],
    html:'<svg width="'+s+'" height="'+s+'" viewBox="-1.5 -1.5 3 3" '
        +'style="transform:rotate('+dir+'deg);overflow:visible;'
        +'filter:drop-shadow(0 0 1.6px rgba(0,0,0,.7))">'+inner+'</svg>'});
}

  // 宣告前被呼叫，落在暫時死區（TDZ）—— 連 typeof 都會拋 ReferenceError、

/* 把引導提示框放到「當前步驟要按的那顆按鈕」旁邊，操作更直覺。
   頂部按鈕→放下方；桌面左側工具列→放右邊；手機底部工具列→放上方。 */
const GUIDE_TARGET={1:'btnDl',2:'mDraw',3:'mStart',4:'btnGo'};
function positionGuide(){
  const g=el.guide;
  g.style.position=g.style.left=g.style.right=g.style.top=g.style.bottom=g.style.width=g.style.maxWidth='';
  if(!S.step) return;

  if(S.step===1){
    const btn=$('btnDl');
    if(!btn) return;
    const r=btn.getBoundingClientRect();
    if(!r.width) return;
    g.style.position='fixed';g.style.right='auto';g.style.bottom='auto';
    g.style.width='auto';
    const gw=Math.min(300, window.innerWidth-24);
    g.style.maxWidth=gw+'px';
    const gh=g.offsetHeight, gwA=Math.min(g.offsetWidth,gw), M=10;
    const top=r.bottom+M;
    const left=Math.min(r.right-gwA, window.innerWidth-gwA-12);
    g.style.left=Math.max(12,left)+'px'; g.style.top=Math.max(12,top)+'px';
    return;
  }

  // 步驟 2, 3, 4 定位在工具欄 (mainDock) 左右側，確保絕不遮擋工具欄
  const dock=$('mainDock');
  if(!dock) return;
  const d=dock.getBoundingClientRect();
  if(!d.width) return;

  g.style.position='fixed';g.style.right='auto';g.style.bottom='auto';g.style.width='auto';
  const gw=Math.min(270, window.innerWidth*0.65);
  g.style.maxWidth=gw+'px';g.style.left='0px';g.style.top='0px';

  const gh=g.offsetHeight, gwA=Math.min(g.offsetWidth,gw);
  let left, top;

  if(S.step===2){
    // 2 號放工具欄左側
    if(d.left >= gwA + 16){
      left = d.left - gwA - 12;
      top = d.top + (d.height - gh)/2;
    }else{
      left = Math.max(12, d.left);
      top = d.top - gh - 10;
    }
  }else{
    // 3, 4 號放工具欄右側
    if(window.innerWidth - d.right >= gwA + 16){
      left = d.right + 12;
      top = d.top + (d.height - gh)/2;
    }else{
      left = Math.min(window.innerWidth - gwA - 12, d.right - gwA);
      top = d.top - gh - 10;
    }
  }

  top = Math.max(12, Math.min(top, window.innerHeight - gh - 12));
  left = Math.max(12, Math.min(left, window.innerWidth - gwA - 12));
  g.style.left = left+'px'; g.style.top = top+'px';
}

function showArea(b){
  const W=[[90,-180],[90,180],[-90,180],[-90,-180]];

  if(areaMask) areaMask.remove();

  areaRect=L.rectangle(b,{color:isLight()?'#000':'#fff',weight:2,dashArray:'7 5',fill:false,interactive:false}).addTo(map);
  // 留出上下非對稱邊距，避免被頂部按鈕或底部工具欄遮擋

}

/* 拖曳畫框（下載範圍與微調框選共用） */
function boxBegin(e){
  boxA=[e.clientX,e.clientY];
  boxEl=document.createElement('div');boxEl.className='box';document.body.appendChild(boxEl);
}
function boxDrag(e){
  if(!boxA||!boxEl) return;
  const x=Math.min(boxA[0],e.clientX),y=Math.min(boxA[1],e.clientY);
  boxEl.style.cssText+=`;left:${x}px;top:${y}px;width:${Math.abs(e.clientX-boxA[0])}px;height:${Math.abs(e.clientY-boxA[1])}px`;
}
/* 收框，回傳 {x0,y0,x1,y1}（相對地圖容器）；沒在畫框就回傳 null */
function boxEnd(e){
  if(!boxA) return null;
  const a=boxA;boxA=null;
  if(boxEl){boxEl.remove();boxEl=null;}
  const r=mc.getBoundingClientRect();
  return {x0:Math.min(a[0],e.clientX)-r.left, y0:Math.min(a[1],e.clientY)-r.top,
          x1:Math.max(a[0],e.clientX)-r.left, y1:Math.max(a[1],e.clientY)-r.top};
}

  const n=S.strokes.length;
  $('btnUndo').disabled=!n||S.locked; $('btnClear').disabled=!n||S.locked;
  $('btnGo').disabled=!(n&&S.start&&S.end)||S.locked;
  ['mDraw','mStart','mEnd'].forEach(i=>$(i).disabled=!S.hasMap||S.locked);
  if(S.locked&&S.mode!=='pan') setMode('pan');

  // 取消修改按鈕：只有在先前有生成結果、且目前退回修改圖案模式時顯示
  if($('btnCancelMod')){
    $('btnCancelMod').style.display = (S.prevResult && !S.sheetUp) ? 'flex' : 'none';
  }

  let d=0;
  for(const s of S.strokes) for(let i=1;i<s.pts.length;i++) d+=map.distance(s.pts[i-1],s.pts[i]);
  if(S.result&&!S.sheetUp){
    // 生成後不能再畫圖，在工具列上方顯示「查看路線結果」按鈕讓使用者點擊叫回
    el.pill.classList.remove('hide');

    el.pill.classList.add('tap');

    el.pill.classList.remove('hide');
    el.pill.textContent=(d/1000).toFixed(2)+' km';
    el.pill.classList.remove('tap');
    updatePillPos();
  }else{
    el.pill.classList.add('hide');
    el.pill.classList.remove('tap');
  }
  // 引導自動推進，不需要使用者點「下一步」
  let st=1;
  if(S.hasMap) st=2;
  if(S.hasMap&&n) st=3;
  if(S.hasMap&&n&&S.start&&S.end) st=4;
  if(S.generated) st=5;
  if(st!==S.step){S.step=st;guide();}
}

    if(d&&Math.hypot(e.clientX-d[0],e.clientY-d[1])<=8) editPick(map.mouseEventToLatLng(e));
    return;
  }
  if(S.boxing&&boxA){
    const r=boxEnd(e);
    if(r&&r.x1-r.x0>30&&r.y1-r.y0>30){
      const p1=map.containerPointToLatLng([r.x0,r.y0]);
      const p2=map.containerPointToLatLng([r.x1,r.y1]);
      const bounds=L.latLngBounds(p1,p2);
      S.boxing=false;$('btnDl').classList.remove('on');
      const km=(map.distance(bounds.getNorthWest(),bounds.getNorthEast())/1000)
             *(map.distance(bounds.getNorthWest(),bounds.getSouthWest())/1000);
      $('dlLabel').textContent=tx('載入中…','Loading…');
      Engine.loadArea(bounds.getSouth(),bounds.getWest(),bounds.getNorth(),bounds.getEast())
        .then(st=>{
          S.hasMap=true;S.bounds=bounds;
          showArea(bounds);
          $('dlLabel').textContent=km.toFixed(1)+' km²';
          ['mDraw','mStart','mEnd'].forEach(i=>$(i).disabled=false);
          toast(tx('路網已載入（'+st.nodes+' 個路口）','Roads loaded ('+st.nodes+' junctions)'));setMode('draw');refresh();
        })
        .catch(err=>{busy('');updateDlLabel();toast(err.message,3000);});
    }
    return;
  }
  if(S.mode==='draw'&&S.cur){
    if(S.cur.length>3) S.strokes.push({pts:S.cur,line:S.curLine});
    else S.curLine.remove();
    S.cur=null;S.curLine=null;refresh();
  }
});
// 起終點標記：綠圈內 ▶＝起點、紅圈內 ■＝終點（比兩個不同色的圓點好辨識）。
// 地圖與匯出圖片用同一套語意（綠=start、紅=stop）。
function seIcon(isStart){
  const P=PC();

  const fg=P['on-accent'];

    ? '<path d="M9.5 7 L17 12 L9.5 17 Z" fill="'+fg+'"/>'
    : '<rect x="8.3" y="8.3" width="7.4" height="7.4" rx="1.2" fill="'+fg+'"/>';

    html:'<svg width="28" height="28" viewBox="0 0 24 24" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))">'
      +'<circle cx="12" cy="12" r="10.4" fill="'+bg+'" stroke="'+fg+'" stroke-width="2.4"/>'+glyph+'</svg>'});

/* 把使用者點的位置吸附到最近的路網節點。
   點在建築物或公園中間的話，solve_route 反正也要把它拉到路上；
   當下就吸附的好處是使用者馬上看得到真正的起點在哪，不會以為自己選的是那個點。
   引擎還沒載好或還沒下載路網時就沿用原座標，不擋住操作。 */
async function snapLatLng(ll){
  try{
    const n=await Engine.snapToNode(ll.lat,ll.lng);
    if(n) return L.latLng(n[0],n[1]);
  }catch(_){}
  return ll;
}
map.on('click',async e=>{
  if(S.editing) return;   // 微調模式的點選由 pointerup 處理
  const isStart=S.mode==='start', isEnd=S.mode==='end';
  if(!isStart&&!isEnd) return;
  if(!inArea(e.latlng)){ toast('起點／終點要在藍色框線內');return; }

  const ll=await snapLatLng(e.latlng);
  // 吸附後仍要在範圍內，否則寧可用原座標（邊緣點可能被吸到框外的節點）
  const use=inArea(ll)?ll:e.latlng;
  const moved=map.distance(e.latlng,use);
  if(isStart){
    if(startMk) startMk.remove();
    startMk=L.marker(use,{icon:seIcon(true),interactive:false,zIndexOffset:900}).addTo(map);
    S.start=use;
  }else{
    if(endMk) endMk.remove();
    endMk=L.marker(use,{icon:seIcon(false),interactive:false,zIndexOffset:900}).addTo(map);
    S.end=use;
  }
  toast(moved>=8
    ? tx((isStart?'起點':'終點')+'已吸附到最近的道路（'+Math.round(moved)+' 公尺）',
         (isStart?'Start':'Finish')+' snapped to the nearest road ('+Math.round(moved)+' m)')
    : tx((isStart?'起點':'終點')+'已設定',(isStart?'Start':'Finish')+' set'));
  refresh();
});

/* ---------- 生成（原型：假資料） ---------- */
/* ---------- 路線預覽（拉桿 + 方向） ---------- */
let pvDone=null,pvHead=null,pvArrows=null,pvTimer=null,poseT=null;
/* 預覽的「跑者」圖示：靜止＝站立、拖曳／播放中＝雙手舉高。SVG 自己畫，深淺底圖都清楚。 */
function personSVG(active){
  const arms = active
    ? '<path d="M13 12.5 L6.5 6.5"/><path d="M13 12.5 L19.5 6.5"/>'   // 雙手舉高
    : '<path d="M13 12.5 L8 18"/><path d="M13 12.5 L18 18"/>';        // 自然垂下
  // 本體吃 --rt-runner，外框吃 --rt-runner-out（壓在亮色路線上要靠外框才分得出來），頭 r=3。
  const P=PC();
  const body='<circle cx="13" cy="5.2" r="3"/><path d="M13 8 L13 19"/>'+arms
            +'<path d="M13 19 L9 27"/><path d="M13 19 L17 27"/>';
  return '<svg width="28" height="32" viewBox="0 0 26 30" style="filter:drop-shadow(0 0 1.4px rgba(0,0,0,.5))">'
    +'<g fill="none" stroke="'+P['runner-out']+'" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">'+body+'</g>'
    +'<g fill="'+P.runner+'" stroke="'+P.runner+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+body+'</g>'
    +'</svg>';
}
function personIcon(active){
  return L.divIcon({className:'',iconSize:[28,32],iconAnchor:[14,29],html:personSVG(active)});
}
function pvPose(active){ S.pvActive=active; if(pvHead) pvHead.setIcon(personIcon(active)); }
let S_arrowList = [];

function pvBuild(res){
  // 把所有分段串成一條連續路徑，並累計距離
  S.path=[];
  res.segments.forEach(sg=>sg.pts.forEach(p=>{
    const last=S.path.length?S.path[S.path.length-1]:null;
    if(!last||last[0]!==p[0]||last[1]!==p[1]) S.path.push(p);
  }));
  S.cum=[0];
  for(let i=1;i<S.path.length;i++)
    S.cum.push(S.cum[i-1]+map.distance(S.path[i-1],S.path[i]));
  S.totalM=S.cum[S.cum.length-1]||0;

  [pvDone,pvHead,pvArrows].forEach(l=>{if(l)l.remove();});
  pvDone=L.polyline([],{color:PC().done,weight:8,opacity:.95}).addTo(map);
  pvHead=L.marker(S.path[0],{icon:personIcon(false),interactive:false,zIndexOffset:1000}).addTo(map);

  // 箭頭規則：每 200m 一個。若相鄰兩點距離 < 30m 則跳過改到下一段。走過的路段自動隱藏。
  // 顏色吃 --rt-arrow，和匯出圖用同一個值
  const arrows = [];
  S_arrowList = [];
  const step = 200;
  for(let targetD = step; targetD < S.totalM - 20; targetD += step){
    const i = pvIndexAt(targetD);
    if(i < 1) continue;
    const a = S.path[i-1], b = S.path[i];
    const segLen = S.cum[i] - S.cum[i-1];
    if(segLen < 30) continue;   // 小於 30m 跳過

    const mid = [(a[0] + b[0])/2, (a[1] + b[1])/2];
    const pa = map.project(a, 18), pb = map.project(b, 18);
    if(pa.x === pb.x && pa.y === pb.y) continue;
    const dir = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI;

    const mk = L.marker(mid, { interactive:false, icon: arrowIcon(dir) });
    arrows.push(mk);
    S_arrowList.push({ d: targetD, dir, mk });
  }

  pvArrows = L.layerGroup(arrows).addTo(map);
  pvSet(0);
}
const PV_PROJ_Z=18;
function pvHeading(d){
  if(!S.path||S.path.length<2) return null;
  const a=S.path[pvIndexAt(Math.max(0,d-20))];
  const b=S.path[Math.min(pvIndexAt(Math.min(S.totalM,d+20)),S.path.length-1)];
  if(!a||!b||(a[0]===b[0]&&a[1]===b[1])) return null;
  const pa=map.project(a,PV_PROJ_Z),pb=map.project(b,PV_PROJ_Z);
  return Math.atan2(pb.y-pa.y,pb.x-pa.x)*180/Math.PI;
}
function pvIndexAt(dist){
  let lo=0,hi=S.cum.length-1;
  while(lo<hi){const mid=(lo+hi)>>1; if(S.cum[mid]<dist) lo=mid+1; else hi=mid;}
  return lo;
}
/* 進度的唯一真實來源。以前存在 #pvSlider.value（0..1000）裡，
   拉桿被高程圖取代後改存這裡，其他地方一律讀 S.pvFrac。 */
S.pvFrac=0;
function pvSet(frac){
  frac=Math.max(0,Math.min(1,frac));
  S.pvFrac=frac;
  const area=$('elevChartArea');
  if(area) area.setAttribute('aria-valuenow',Math.round(frac*100));
  if(!S.path||!S.path.length){ updateElevRunnerDot(frac); return; }
  const target=S.totalM*frac;
  const i=pvIndexAt(target);
  const shown=S.path.slice(0,Math.max(i+1,1));
  let head=S.path[Math.max(i,0)];
  if(i>0){
    const seg=S.cum[i]-S.cum[i-1];
    const t=seg>0?(target-S.cum[i-1])/seg:0;
    const a=S.path[i-1],b=S.path[i];
    head=[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
    shown[shown.length-1]=head;
  }
  pvDone.setLatLngs(shown);
  pvHead.setLatLng(head);
  $('pvAt').textContent=(target/1000).toFixed(2)+' km';
  $('pvPct').textContent=Math.round(frac*100)+'%';

  // 已走過路段動態隱藏箭頭，僅保留前景路段箭頭
  S_arrowList.forEach(item => {
    if(!item.mk || !item.mk.getElement()) return;
    item.mk.getElement().style.display = (item.d <= target) ? 'none' : '';
  });

  updateElevRunnerDot(frac);
}

/* ---- 在高程圖上拖曳＝拉時間軸 ---- */
function pvFracFromEvent(e){
  const r=$('elevChartArea').getBoundingClientRect();
  if(!r.width) return 0;
  return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
}
(()=>{
  const area=$('elevChartArea');
  let dragging=false;
  const scrub=e=>{
    pvSet(pvFracFromEvent(e));
    pvPose(true); clearTimeout(poseT); poseT=setTimeout(()=>pvPose(false),320);
  };
  area.addEventListener('pointerdown',e=>{
    if(!S.result) return;
    dragging=true;
    pvStop();                       // 拖曳優先於播放
    // 抓不到指標就算了，照樣要能拖——不能讓它擋掉後面的 scrub
    try{ area.setPointerCapture(e.pointerId); }catch(_){}
    scrub(e);
    e.preventDefault();             // 避免手機上變成選取／捲動
  });
  area.addEventListener('pointermove',e=>{ if(dragging) scrub(e); });
  const end=e=>{
    if(!dragging) return;
    dragging=false;
    try{ area.releasePointerCapture(e.pointerId); }catch(_){}
    pvPose(false);
  };
  area.addEventListener('pointerup',end);
  area.addEventListener('pointercancel',end);
  // 鍵盤操作：原本用原生 range 時免費得到的，換成自訂控制項後要自己補回來
  area.addEventListener('keydown',e=>{
    if(!S.result) return;
    const step=e.shiftKey?0.1:0.02;
    let f=S.pvFrac;
    if(e.key==='ArrowRight'||e.key==='ArrowUp') f+=step;
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown') f-=step;
    else if(e.key==='Home') f=0;
    else if(e.key==='End') f=1;
    else return;
    e.preventDefault(); pvStop(); pvSet(f);
  });
})();

function pvStop(){if(pvTimer){clearInterval(pvTimer);pvTimer=null;$('pvPlay').textContent='▶';} pvPose(false);}
$('pvPlay').onclick=()=>{
  if(pvTimer){pvStop();return;}
  if(S.pvFrac>=1) pvSet(0);
  $('pvPlay').textContent='⏸';
  pvPose(true);   // 播放中＝奔跑（雙手舉高）
  pvTimer=setInterval(()=>{
    // 前進速度跟著配速：配速越慢（S.pace 越大）小人跑越慢。
    // 等於把真實跑步時間壓縮成固定比例（約 1/120）播放。
    const vMps = S.pace>0 ? 1000/(S.pace*60) : 2.8;   // 真實跑步 m/s
    const stepM = vMps * 120 * 0.04;                   // 每 40ms 前進的公尺
    const inc = S.totalM>0 ? stepM/S.totalM : 0.008;
    let f=S.pvFrac+inc;
    if(f>=1){f=1;pvSet(f);pvStop();return;}
    pvSet(f);
  },40);
};

S.pace=parseFloat(localStorage.getItem('runart_pace'))||6;   // 分鐘/公里
S.km=0;

/* ---------- 生成（真實運算） ---------- */
/* 套用一份運算結果（生成與微調共用）。微調時不重建預覽，
   否則預覽圖層會蓋住要點選的節點。 */
function applyResult(res,withPreview=true){
  S.result=res;
  if(routeLayer) routeLayer.remove();
  const layers=[];
  res.segments.forEach(sg=>{
    if(sg.kind==='draw'){
      layers.push(L.polyline(sg.pts,{color:PC().pending,weight:9,opacity:.95}));
    }else{
      // 連接段（起點→路線、路線→終點、筆畫之間）：細的淺灰虛線，和道路(路網)顏色區分。
      layers.push(L.polyline(sg.pts,{color:PC().connector,weight:2.5,opacity:.95,dashArray:'7 6'}));
    }
  });
  routeLayer=L.layerGroup(layers).addTo(map);
  /* 「已跑」那條是獨立圖層，剛剛才重建底層的未跑路線 → 它現在壓在上面。
     不拉回最前面的話，拖進度條會看起來完全沒反應（顏色被蓋掉）。
     只有 withPreview=false 這條路徑會踩到：那時不會重建 pvDone，
     所以順序不會自己修正。注意 pvDone 是 Polyline（有 bringToFront），
     不是 LayerGroup（沒有）。 */
  try{ if(pvDone && map.hasLayer(pvDone)) pvDone.bringToFront(); }catch(_){}
  S.km=res.total_m/1000;
  $('sDist').textContent=S.km.toFixed(2)+' km';
  $('sFit').textContent=Math.round(res.fit)+'%';
  paceUI();
  if(withPreview) pvBuild(res);
}
function pvClear(){
  pvStop();
  [pvDone,pvHead,pvArrows].forEach(l=>{if(l)l.remove();});
  pvDone=pvHead=pvArrows=null;
}
/* ---------- 預估爬升／下降 ----------
   用 Open-Meteo 免費高程 API（有 CORS，一次最多 100 點）查整條路線的高度，
   加總正的落差＝爬升、負的＝下降。DEM 解析度較粗，城市路線通常起伏不大屬正常。 */
let elevChartData = null;

/* 高程折線圖的座標系。SVG 是 preserveAspectRatio="none" 拉伸的，
   所以這些是「虛擬單位」，不是像素——疊層用百分比換算回來（見 renderElevChart）。
   上下各留 EL_PADT / EL_PADB 的空白帶，專門給最高／最低標籤站，
   這樣「最高一定在上、最低一定在下」才不會頂到邊界被裁掉。
   改動這裡的話 updateElevRunnerDot 會跟著走（它讀同一組常數）。 */
const EL_W = 340, EL_H = 76, EL_PADT = 20, EL_PADB = 20, EL_LBL_GAP = 11;

function renderElevChart(data){
  const P = PC();
  const area = $('elevChartArea');
  if(!area) return;
  /* 高程 API 失敗時「不能」把整塊藏起來——它現在同時是路線預覽的拉桿，
     藏掉就等於連預覽都不能拖了。改成退化為一條普通軌道，照樣可以拖。 */
  if(!data || !data.elevations || data.elevations.length < 2){
    elevChartData = null;
    if($('elevRangeText')) $('elevRangeText').textContent = '–';
    area.innerHTML = `
      <div class="elev-track"><div class="elev-track-run" id="elevTrackRun"></div></div>
      <div id="elevRunnerDot"></div>`;
    updateElevRunnerDot(S.pvFrac || 0);
    return;
  }
  elevChartData = data;

  const elevations = data.elevations;
  let minE = Infinity, maxE = -Infinity, minIdx = 0, maxIdx = 0;
  elevations.forEach((e, i) => {
    if(e < minE){ minE = e; minIdx = i; }
    if(e > maxE){ maxE = e; maxIdx = i; }
  });
  const rangeE = Math.max(10, maxE - minE);

  if($('elevRangeText')) $('elevRangeText').textContent = tx('最高 ','Max ') + Math.round(maxE) + tx(' m / 最低 ',' m / Min ') + Math.round(minE) + ' m';

  const W = EL_W, H = EL_H, padT = EL_PADT, padB = EL_PADB;
  const chartW = W, chartH = H - padT - padB;

  const pts = elevations.map((e, idx) => {
    const x = (idx / (elevations.length - 1)) * chartW;
    const y = padT + chartH - ((e - minE) / rangeE) * chartH;
    return { x, y, e, idx };
  });

  const pathStr = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`);
  const lineD = 'M ' + pathStr.join(' L ');
  const areaD = `M 0,${H - padB} L ` + pathStr.join(' L ') + ` L ${W},${H - padB} Z`;

  const minPt = pts[minIdx];
  const maxPt = pts[maxIdx];

  /* 疊層用百分比定位，和 SVG 被拉伸後的位置完全對齊（同一個 viewBox 比例）。
     標籤預設放在點的外側，太靠邊界就翻到另一側，避免被裁掉。
     水平方向用 min()/max() 夾住，讓標籤貼著點但不會突出圖表左右緣。 */
  const pctX = p => (p.x / W) * 100;
  const pctY = y => (y / H) * 100;
  const lblX = p => `max(30px, min(calc(100% - 30px), ${pctX(p).toFixed(2)}%))`;
  /* 最高固定在點的上方、最低固定在下方。上下各留了 EL_PADT/EL_PADB
     的空白帶，所以就算峰頂剛好頂到繪圖區上緣，標籤還是塞得下不會被裁。 */
  const maxLblY = Math.max(EL_LBL_GAP, maxPt.y - EL_LBL_GAP);
  const minLblY = Math.min(H - EL_LBL_GAP, minPt.y + EL_LBL_GAP);

  /* 已跑／未跑用一個 clipPath 切開，和地圖上的路線同一套語彙（暗＝還沒跑到）。
     只更新那個 rect 的寬度就能重畫進度，不必每次重建整段 SVG。 */
  area.innerHTML = `
    <svg class="elev-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="elevGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${P.elev}" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="${P.elev}" stop-opacity="0.03"/>
        </linearGradient>
        <clipPath id="elevRunClip">
          <rect id="elevRunRect" x="0" y="0" width="0" height="${H}"/>
        </clipPath>
      </defs>
      <path d="${areaD}" fill="url(#elevGrad)" opacity="0.28"/>
      <path d="${lineD}" fill="none" stroke="${P['elev-dim']}" stroke-width="2.2"
            vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
      <g clip-path="url(#elevRunClip)">
        <path d="${areaD}" fill="url(#elevGrad)"/>
        <path d="${lineD}" fill="none" stroke="${P.elev}" stroke-width="2.2"
              vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
    <div class="elev-pt max" style="left:${pctX(maxPt).toFixed(2)}%;top:${pctY(maxPt.y).toFixed(2)}%"></div>
    <div class="elev-pt min" style="left:${pctX(minPt).toFixed(2)}%;top:${pctY(minPt.y).toFixed(2)}%"></div>
    <div class="elev-lbl max" style="left:${lblX(maxPt)};top:${pctY(maxLblY).toFixed(2)}%">▲ ${Math.round(maxE)} m</div>
    <div class="elev-lbl min" style="left:${lblX(minPt)};top:${pctY(minLblY).toFixed(2)}%">▼ ${Math.round(minE)} m</div>
    <div id="elevRunnerDot"></div>
  `;

  updateElevRunnerDot(S.pvFrac || 0);
}

function updateElevRunnerDot(frac){
  frac = Math.max(0, Math.min(1, frac || 0));
  const dot = $('elevRunnerDot');
  if(!dot) return;
  const W = EL_W;
  // 沒有高程資料時只推進純軌道的進度條，跑者點壓在軌道正中央
  if(!elevChartData || !elevChartData.elevations){
    const run = $('elevTrackRun');
    if(run) run.style.width = (frac * 100).toFixed(2) + '%';
    dot.style.left = (frac * 100).toFixed(2) + '%';
    dot.style.top = '50%';
    return;
  }
  const runRect = document.getElementById('elevRunRect');
  if(runRect) runRect.setAttribute('width', (frac * W).toFixed(2));
  const elevations = elevChartData.elevations;
  let minE = Infinity, maxE = -Infinity;
  elevations.forEach(e => {
    if(e < minE) minE = e;
    if(e > maxE) maxE = e;
  });
  const rangeE = Math.max(10, maxE - minE);

  /* 必須用和 renderElevChart 完全相同的 viewBox 幾何（H=60，不是容器的 58px），
     否則跑者點會固定偏離折線約 1px——之前就是拿 offsetHeight 當 H 才對不準。
     改用百分比後也不必再讀 offsetWidth，視窗縮放時位置自動跟著對。 */
  const H = EL_H, padT = EL_PADT, padB = EL_PADB;
  const chartH = H - padT - padB;

  const idxFloat = Math.max(0, Math.min(1, frac)) * (elevations.length - 1);
  const idx = Math.floor(idxFloat);
  const t = idxFloat - idx;
  const e1 = elevations[Math.min(idx, elevations.length - 1)];
  const e2 = elevations[Math.min(idx + 1, elevations.length - 1)];
  const e = e1 + (e2 - e1) * t;

  const y = padT + chartH - ((e - minE) / rangeE) * chartH;

  dot.style.left = (Math.max(0, Math.min(1, frac)) * 100).toFixed(2) + '%';
  dot.style.top = ((y / H) * 100).toFixed(2) + '%';
}

let elevSeq=0;
async function updateElevation(){
  if(!S.result){renderElevChart(null);return;}
  const path=[];
  S.result.segments.forEach(sg=>sg.pts.forEach(p=>{
    const last=path.length?path[path.length-1]:null;
    if(!last||last[0]!==p[0]||last[1]!==p[1]) path.push(p);
  }));
  if(path.length<2){$('sElev').textContent='–';renderElevChart(null);return;}
  const N=Math.min(100,path.length);
  const samp=[];
  for(let i=0;i<N;i++) samp.push(path[Math.round(i*(path.length-1)/(N-1))]);
  const seq=++elevSeq;
  $('sElev').textContent=tx('計算中…','Calculating…');
  try{
    const lat=samp.map(p=>p[0].toFixed(5)).join(',');
    const lon=samp.map(p=>p[1].toFixed(5)).join(',');
    const ctrl=new AbortController();const tm=setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch('https://api.open-meteo.com/v1/elevation?latitude='+lat+'&longitude='+lon,{signal:ctrl.signal});
    clearTimeout(tm);
    const e=(await r.json()).elevation;
    if(seq!==elevSeq) return;
    if(!e||!e.length) throw 0;
    let up=0,down=0;
    for(let i=1;i<e.length;i++){const d=e[i]-e[i-1]; if(d>0)up+=d; else down-=d;}
    S.elevGain=Math.round(up); S.elevLoss=Math.round(down);
    $('sElev').textContent='↑'+S.elevGain+' ↓'+S.elevLoss+' m';
    renderElevChart({ elevations: e });
  }catch(_){
    if(seq===elevSeq){ S.elevGain=null;S.elevLoss=null; $('sElev').textContent='–'; renderElevChart(null); }
  }
}

/* ---------- 微調路徑 ---------- */
/* 節點畫在 canvas 上（幾百個 SVG 圓在手機上會很鈍），指定 pane: 'markerPane' 確保於路線上層 */
let nodeRenderer=null;
const NODE_R=4, NODE_SEL_R=9, NODE_TURN_R=7.5, PICK_TOL_PX=24;
const TURN_DEG=28;   // 轉多少度才算「轉彎點」
let nodeLayer=null, nodeMks=[];

/* 找出一串節點裡哪些是「轉彎點」：用投影後的平面角度，避免 Mercator 拉伸。
   回傳與 latlngs 等長的布林陣列。 */
function turnFlags(latlngs){
  const f=new Array(latlngs.length).fill(false);
  const pr=ll=>map.project(ll,18);
  for(let i=1;i<latlngs.length-1;i++){
    const a=latlngs[i-1],b=latlngs[i],c=latlngs[i+1];
    if(!a||!b||!c) continue;
    const pa=pr(a),pb=pr(b),pc=pr(c);
    let d=Math.abs(Math.atan2(pc.y-pb.y,pc.x-pb.x)-Math.atan2(pb.y-pa.y,pb.x-pa.x))*180/Math.PI;
    if(d>180) d=360-d;
    if(d>=TURN_DEG) f[i]=true;
  }
  return f;
}
// 一個節點沒被選取時該有的樣式（轉彎點醒目、其餘小而淡）
function nodeStyle(turn){
  const P=PC();
  return turn
    ? {radius:NODE_TURN_R,color:P['on-accent'],weight:2,fillColor:P['node-turn'],fillOpacity:1}
    : {radius:NODE_R,color:P.node,weight:1,fillColor:P.node,fillOpacity:.55};
}
function editBuild(){
  if(nodeLayer) nodeLayer.remove();
  nodeMks=[];S.sel.clear();
  if(!nodeRenderer){
    try { nodeRenderer = L.canvas({padding:.3, pane:'markerPane'}); }
    catch(_) { nodeRenderer = L.canvas({padding:.3}); }
  }
  const marks=[];
  for(const sg of S.result.segments){
    const flags=turnFlags(sg.nodes||[]);   // 只把轉彎點標出來
    (sg.nodes||[]).forEach((ll,n)=>{
      if(!ll) return;   // null 佔位：這個節點不在路網裡，不能編輯
      const turn=!!flags[n];
      // 指定 pane: 'markerPane' 讓節點永遠顯示於路線 Layer 之上
      const mk=L.circleMarker(ll,{pane:'markerPane',renderer:nodeRenderer,interactive:false,...nodeStyle(turn)});
      nodeMks.push({si:sg.si,n,ll,mk,turn});
      marks.push(mk);
    });
  }
  nodeLayer=L.layerGroup(marks,{pane:'markerPane'}).addTo(map);
  /* 疊在路線之上靠的是 pane：markerPane(600) 本來就高於路線的 overlayPane(400)，
     再用 renderer container 的 z-index 壓過 markerPane 內的起訖點圖釘。
     這裡不要呼叫 nodeLayer.bringToFront() —— L.layerGroup 沒有這個方法（只有
     L.featureGroup 有），會丟 TypeError。而且 editBuild 是在 Engine.editDelete()
     的 .then() 裡呼叫的，丟出來的錯會被同一條 promise 的 .catch 接走，
     於是「刪除其實成功了」卻跳出「刪除失敗」的提示，選取還被清掉。 */
  if(nodeRenderer && nodeRenderer._container) nodeRenderer._container.style.zIndex = '750';
  editUI();
}
function editMark(i,on){
  const d=nodeMks[i];
  if(on) d.mk.setStyle({radius:NODE_SEL_R,color:PC()['node-sel'],weight:1,fillColor:PC()['node-sel'],fillOpacity:1});
  else d.mk.setStyle(nodeStyle(d.turn));
}
function editUI(){
  const n=S.sel.size;
  $('eDel').disabled=!n;$('eNone').disabled=!n;
  $('eUndo').disabled=!(S.result&&S.result.undo);
  el.pill.classList.remove('hide');
  el.pill.textContent=n?tx('已選 '+n+' 個節點',n+' selected'):tx(nodeMks.length+' 個可調整的節點',nodeMks.length+' editable nodes');
}
function editPick(ll){
  const p0=map.latLngToContainerPoint(ll);
  let best=-1,bd=1e9;
  nodeMks.forEach((d,i)=>{
    const p=map.latLngToContainerPoint(d.ll);
    const dist=Math.hypot(p.x-p0.x,p.y-p0.y);
    if(dist<bd){bd=dist;best=i;}
  });
  if(best<0||bd>PICK_TOL_PX) return;
  if(S.sel.has(best)) S.sel.delete(best); else S.sel.add(best);
  editMark(best,S.sel.has(best));editUI();
}
function editBoxSelect(r){
  if(r.x1-r.x0<6&&r.y1-r.y0<6) return;
  nodeMks.forEach((d,i)=>{
    if(S.sel.has(i)) return;
    const p=map.latLngToContainerPoint(d.ll);
    if(p.x>=r.x0&&p.x<=r.x1&&p.y>=r.y0&&p.y<=r.y1){S.sel.add(i);editMark(i,true);}
  });
  editUI();
}
