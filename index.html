<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Running Art</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* 深色（預設）與淺色主題都用這組變數，只有 body.light 覆寫。
     強調色（藍/綠/紅）兩種主題共用，不放進來。 */
  :root{
    /* color-scheme 讓原生控制項（拉桿、捲軸）跟著主題，而不是跟著作業系統。
       少了它，淺色主題下的 range 拉桿在深色系統上會是深色的。 */
    color-scheme:dark;
    --bg:#262a30; --panel:#14171c; --panel2:#171b21; --panel3:#0f1216;
    --border:#262b33; --border2:#3a4048;
    --text:#e8eaed; --text2:#c9cdd3; --dim:#8b929c;
    --glass:rgba(20,23,28,.9); --scrim:rgba(6,8,11,.72);
    /* CARTO dark_all 的道路偏暗，提亮讓街道看得清楚 */
    --tile-filter:brightness(2.3) contrast(0.92);
  }
  body.light{
    color-scheme:light;
    --bg:#eef1f5; --panel:#ffffff; --panel2:#eef1f6; --panel3:#e6eaf0;
    --border:#d3d9e2; --border2:#c2cad6;
    --text:#1a1d22; --text2:#3a4048; --dim:#6b727d;
    --glass:rgba(255,255,255,.9); --scrim:rgba(30,40,55,.45);
    --tile-filter:none;   /* light_all 底圖本來就亮，不用再提 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--text)}
  #map{position:absolute;inset:0;background:var(--bg)}
  .leaflet-container{background:var(--bg)}
  .leaflet-tile-pane{filter:var(--tile-filter)}

  /* ---- 頂部 ---- */
  .top{position:absolute;top:0;left:0;right:0;z-index:500;padding:10px 12px;
    display:flex;gap:8px;align-items:center;pointer-events:none}
  .top>*{pointer-events:auto}
  .brand{font-size:15px;font-weight:700;letter-spacing:.5px;
    background:var(--glass);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:10px;padding:8px 12px}
  .btn-dl{display:flex;align-items:center;gap:6px;
    background:var(--glass);backdrop-filter:blur(8px);
    border:1px solid var(--border);color:var(--text);border-radius:10px;
    padding:9px 13px;font-size:13px;font-weight:500}
  .btn-dl.push{margin-left:auto}
  .btn-dl.on{background:#2563eb;border-color:#2563eb;color:#fff}
  /* 圖示按鈕鎖死 38×38，內容置中：不管裝 SVG 或「EN」/「中」文字，大小都一致
     （拉丁字母與 CJK 行高不同，不鎖高度會讓語言按鈕看起來忽大忽小） */
  .icon-btn{flex:none;width:38px;height:38px;padding:0;justify-content:center;line-height:1}
  /* 載入地圖是主要入口，給強調色邊框凸顯 */
  #btnDl{border:1.6px solid #2563eb;height:38px}
  .icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}

  /* ---- 引導條 ---- */
  .guide{position:absolute;left:12px;right:12px;bottom:150px;z-index:500;
    background:var(--glass);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-left:3px solid #2563eb;border-radius:10px;
    padding:11px 13px;display:flex;gap:10px;align-items:center;
    transition:opacity .25s,transform .25s}
  .guide.hide{opacity:0;transform:translateY(6px);pointer-events:none}
  .guide .n{width:21px;height:21px;flex:none;border-radius:50%;background:#2563eb;
    color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
  .guide p{margin:0;font-size:13px;line-height:1.45;color:var(--text2)}
  .guide b{color:var(--text);font-weight:500}

  /* ---- 底部工具列 ---- */
  .dock{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;
    background:var(--glass);backdrop-filter:blur(12px);
    border:1px solid var(--border);border-radius:16px;padding:8px;
    display:flex;flex-direction:column;gap:8px}
  .modes{display:flex;gap:6px}
  .m{flex:1;background:transparent;border:0;border-radius:11px;padding:9px 4px;
    color:var(--dim);font-size:11px;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:4px}
  .m svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .m.on{background:#2563eb;color:#fff}
  .m:disabled{opacity:.32}
  .row2{display:flex;gap:6px}
  .sm{background:var(--panel2);border:1px solid var(--border);border-radius:11px;
    color:var(--text2);font-size:12.5px;font-family:inherit;padding:10px 12px;
    display:flex;align-items:center;gap:5px}
  .sm svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .sm:disabled{opacity:.32}
  .go{flex:1;justify-content:center;background:#16a34a;border-color:#16a34a;
    color:#fff;font-weight:500;font-size:14px}
  .go:disabled{background:var(--panel2);border-color:var(--border);color:var(--dim)}
  /* 微調路徑工具列 */
  .dock[hidden]{display:none}
  #editDock .sm{flex:1;justify-content:center}
  .sm.on{background:#2563eb;border-color:#2563eb;color:#fff}
  .sm.danger{background:#dc2626;border-color:#dc2626;color:#fff;font-weight:500}
  .sm.danger:disabled{background:var(--panel2);border-color:var(--border);color:var(--dim)}

  /* ---- 恢復結果按鈕 / 距離膠囊（移至工具列上方） ---- */
  .pill{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);z-index:550;
    background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--border);
    border-radius:999px;padding:7px 18px;font-size:13px;font-weight:500;
    transition:opacity .2s, transform .2s, background .2s;white-space:nowrap}
  .pill.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(8px)}
  .pill.tap{background:#2563eb;border-color:#2563eb;color:#fff;cursor:pointer;
    box-shadow:0 4px 14px rgba(37,99,235,.4)}

  /* ---- 結果面板 ---- */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:600;
    background:var(--panel);border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;padding:14px 20px 18px;
    transform:translateY(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-sizing:border-box;overflow-x:hidden}
  .sheet.up{transform:translateY(0)}
  .grip{width:34px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 12px}

  /* 四大群組由左至右：Group 1 -> Group 3 -> Group 2 -> Group 4，寬度展延且底部齊平對齊 */
  .sheet-content{display:flex;gap:12px;align-items:stretch;width:100%;box-sizing:border-box}

  /* 群組 1：數據 4 框與配速框 */
  .grp-1{flex:1.1 1 270px;display:flex;flex-direction:column;gap:8px;min-width:0;justify-content:space-between}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1 1 auto}
  .stat{background:var(--panel2);border-radius:11px;padding:8px 10px;min-width:0;
    display:flex;flex-direction:column;justify-content:center}
  .stat span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat b{font-size:15px;font-weight:600;white-space:nowrap;display:inline-block}

  /* 配速框：配速按鈕放在速度文字右側 */
  .pace{background:var(--panel2);border-radius:11px;padding:8px 10px;
    display:flex;flex-direction:column;justify-content:center;gap:3px;flex:0 0 auto}
  .pace .lbl{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap}
  .pace .pace-main{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pace .pval-row{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
  .pace .pval-row b{font-size:16px;font-weight:600}
  .pace .pval-row .unit{font-size:11px;color:var(--dim)}
  .pace .pbtn-row{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .pace .pbtn-row button{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel3);color:var(--text);font-size:16px;font-family:inherit;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer}

  /* 群組 3：路線預覽與高程變化圖 */
  .grp-3{flex:1.5 1 340px;display:flex;flex-direction:column;gap:8px;min-width:0;justify-content:space-between}
  .prev{background:var(--panel2);border-radius:11px;padding:10px 14px;
    display:flex;align-items:center;gap:14px;flex:0 0 auto}
  .prev .lbl{flex:0 0 auto;font-size:12px;color:var(--dim);white-space:nowrap;font-weight:500}
  .prev .pv-col{flex:1 1 auto;display:flex;flex-direction:column;gap:6px;min-width:0}
  .prev .pv-info{display:flex;align-items:baseline;justify-content:space-between;white-space:nowrap}
  .prev .pv-info b{font-size:14px;font-weight:600;white-space:nowrap}
  .prev .pv-info .unit{font-size:11.5px;color:var(--dim);white-space:nowrap}
  /* 拉桿：點點 18px， margin-top 給 6px 留白空間 */
  #pvSlider{width:100%;margin:6px 0 2px;-webkit-appearance:none;appearance:none;height:6px;
    border-radius:3px;background:linear-gradient(to right,#4169E1 0%,#708090 0%);outline:none;
    display:block;box-sizing:border-box;vertical-align:middle}
  #pvSlider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;
    border-radius:50%;background:#4169E1;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);
    cursor:pointer;margin-top:-6px;box-sizing:border-box}
  #pvSlider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#4169E1;
    border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;box-sizing:border-box}
  #pvPlay{flex:0 0 36px;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel3);color:var(--text);font-size:14px;font-family:inherit;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer}

  /* 高程折線圖 (Elevation Profile Chart) - 對齊預覽拉桿兩側且文字不換行 */
  .elev-box{background:var(--panel2);border-radius:11px;padding:8px 14px;
    display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 auto;justify-content:center}
  .elev-box .elev-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--dim);white-space:nowrap}
  .elev-box .elev-head span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .elev-box .elev-head b{color:var(--text);font-weight:600;font-size:12.5px;white-space:nowrap}
  #elevChartArea{position:relative;width:100%;height:58px;margin:2px 0;box-sizing:border-box}
  .elev-chart-svg{width:100%;height:100%;display:block;overflow:visible}
  /* 跑者藍點縮小 50% (9px x 9px 完美正圓) */
  #elevRunnerDot{position:absolute;width:9px;height:9px;border-radius:50%;
    background:#4169E1;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);
    transform:translate(-50%,-50%);pointer-events:none;transition:left 0.05s, top 0.05s;z-index:10}

  /* 群組 2：微調與編輯四按鈕 (2x2) */
  .grp-2{flex:1 1 180px;display:flex;flex-direction:column;justify-content:stretch;min-width:0}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0;height:100%}
  .tools button{background:var(--panel2);border:1px solid var(--border);border-radius:11px;
    color:var(--text2);font-size:11.5px;font-weight:500;font-family:inherit;padding:8px 4px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;white-space:nowrap;cursor:pointer;height:100%}
  .tools svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .tools button:disabled{opacity:.32}

  /* 群組 4：下載按鈕（下載圖片在上、下載 GPX 在下） */
  .grp-4{flex:0.9 1 145px;display:flex;flex-direction:column;gap:8px;justify-content:stretch;min-width:0}
  .grp-4 button{flex:1;padding:10px 12px;border-radius:11px;font-size:13.5px;
    font-family:inherit;font-weight:600;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;height:calc(50% - 4px)}
  .grp-4 .exp{background:#16a34a;border-color:#16a34a;color:#fff}
  .grp-4 .pri{background:#2563eb;border-color:#2563eb;color:#fff}
  .grp-4 svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}

  @media (max-width:960px){
    .sheet-content{flex-direction:column;gap:10px}
    .grp-1, .grp-3, .grp-2, .grp-4{width:100%;flex:none}
    .grp-4{flex-direction:row;gap:8px}
  }

  /* ---- 匯出圖片對話框 ----
     這整區的樣式曾經整批遺失，害得 .modal 是 position:static 沒有 z-index，
     被 position:absolute 的 #map 整片蓋住 → 按「下載圖片」看起來完全沒反應。
     動這裡之前先確認 .modal 仍然是 fixed/absolute + z-index。 */
  .modal{position:absolute;inset:0;z-index:900;background:var(--scrim);
    display:flex;align-items:center;justify-content:center;padding:16px}
  .modal[hidden]{display:none}
  .mbox{width:100%;max-width:720px;max-height:calc(100vh - 32px);overflow-y:auto;
    background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
  .mtitle{font-size:15px;font-weight:600;margin-bottom:12px}
  .mcols{display:flex;gap:16px;align-items:flex-start}
  .mopts{flex:1 1 300px;min-width:0}
  .mprevwrap{flex:0 0 264px;display:flex;align-items:flex-start;justify-content:center;
    background:var(--panel3);border:1px solid var(--border);border-radius:12px;padding:10px}
  /* 透明底圖（去背 PNG）在單色面板上看不出來，用棋盤格襯底才看得出哪裡是透明 */
  .mprev{width:100%;max-width:244px;height:auto;display:block;border-radius:8px;
    background-color:#9aa3ad;
    background-image:linear-gradient(45deg,#7d858e 25%,transparent 25%,transparent 75%,#7d858e 75%),
                     linear-gradient(45deg,#7d858e 25%,transparent 25%,transparent 75%,#7d858e 75%);
    background-size:16px 16px;background-position:0 0,8px 8px}
  .rlabel{font-size:11.5px;color:var(--dim);margin:2px 2px 6px}
  .ratios{display:flex;gap:6px;margin-bottom:12px}
  .ratios.lyrs{flex-wrap:wrap}
  .rt{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:11px;
    color:var(--text2);font-size:13.5px;font-weight:500;font-family:inherit;padding:9px 2px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:pointer;white-space:nowrap;min-width:0}
  .rt i{font-style:normal;font-size:10.5px;color:var(--dim);font-weight:400}
  .rt.on{background:#2563eb;border-color:#2563eb;color:#fff}
  .rt.on i{color:rgba(255,255,255,.82)}
  .lyrs .rt{flex:1 1 28%;font-size:12.5px;padding:8px 4px}
  .mprog{width:100%;margin:2px 0 0;-webkit-appearance:none;appearance:none;height:6px;
    border-radius:3px;background:linear-gradient(to right,#4169E1 0%,#708090 0%);
    outline:none;display:block}
  .mprog::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;
    border-radius:50%;background:#4169E1;border:2px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;margin-top:-6px;box-sizing:border-box}
  .mprog::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#4169E1;
    border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;box-sizing:border-box}
  .mact{display:flex;gap:8px;margin-top:14px}
  .mact button{flex:1;padding:11px;border-radius:11px;font-size:13.5px;font-family:inherit;
    font-weight:500;border:1px solid var(--border);background:var(--panel2);color:var(--text);
    cursor:pointer;white-space:nowrap}
  .mact .pri{background:#2563eb;border-color:#2563eb;color:#fff}
  .mact button:disabled{opacity:.4}
  /* 產生完成後的圖片預覽（給 Safari／手機長按儲存用） */
  .mshot{display:block;width:100%;max-width:300px;margin:0 auto;border-radius:10px;
    border:1px solid var(--border)}
  .mhint{font-size:11.5px;color:var(--dim);margin:10px 2px 0;line-height:1.5}
  @media (max-width:680px){
    .mbox{padding:14px}
    .mcols{flex-direction:column-reverse;gap:12px}
    .mprevwrap{flex:none;width:100%}
    .mprev{max-width:190px}
    .mshot{max-width:210px}
  }

  .toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:900;
    background:var(--glass);border:1px solid var(--border);border-radius:12px;color:var(--text);
    padding:15px 20px;font-size:13.5px;text-align:center;opacity:0;
    transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .busy{position:absolute;top:0;left:0;right:0;z-index:800;display:none;
    align-items:center;gap:9px;justify-content:center;padding:10px;color:var(--text);
    background:var(--glass);border-bottom:1px solid var(--border);font-size:13px}
  .busy.on{display:flex}
  .spin{width:14px;height:14px;border:2px solid #2563eb;border-top-color:transparent;
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .box{position:absolute;border:2px dashed #2563eb;background:rgba(37,99,235,.14);
    z-index:450;pointer-events:none;border-radius:4px}

  /* ==== 桌面版與大螢幕 ==== */
  @media (min-width:900px){
    .dock{left:50%;transform:translateX(-50%);right:auto;width:auto;max-width:680px}
    .sheet{left:50%;right:auto;width:calc(100vw - 36px);max-width:1380px;transform:translateX(-50%) translateY(102%);
      max-height:calc(100vh - 80px);overflow-y:auto;box-sizing:border-box;padding:14px 20px 18px}
    .sheet.up{transform:translateX(-50%) translateY(0)}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="brand">Running Art</div>
  <button class="btn-dl icon-btn push" id="btnLang" aria-label="Language">EN</button>
  <button class="btn-dl icon-btn" id="btnTheme" aria-label="切換深淺色主題">
    <svg id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 12H2M22 12h-2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg>
  </button>
  <button class="btn-dl" id="btnDl">
    <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
    <span id="dlLabel">載入地圖範圍</span>
  </button>
</div>

<div class="pill hide" id="pill">0.00 km</div>

<div class="guide" id="guide">
  <div class="n" id="gn">1</div>
  <p id="gt"></p>
</div>

<div class="dock" id="mainDock">
  <div class="modes">
    <button class="m on" data-mode="pan" id="mPan">
      <svg viewBox="0 0 24 24"><path d="M8 13V5a1.5 1.5 0 013 0v6m0-1V4a1.5 1.5 0 013 0v6m0 0V6a1.5 1.5 0 013 0v7m0-2a1.5 1.5 0 013 0v4a7 7 0 01-7 7h-1a7 7 0 01-7-7v-1a1.5 1.5 0 013-1"/></svg>
      <span data-en="Move">移動</span>
    </button>
    <button class="m" data-mode="draw" id="mDraw" disabled>
      <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/></svg>
      <span data-en="Draw">畫圖</span>
    </button>
    <button class="m" data-mode="start" id="mStart" disabled>

<script>
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([25.0610,121.5330],16);

/* ---------- 深／淺色主題 ---------- */
// 底圖跟著換：深色用 CARTO dark_all，淺色用 light_all。
const TILE_URL=t=>`https://{s}.basemaps.cartocdn.com/${t?'light_all':'dark_all'}/{z}/{x}/{y}{r}.png`;
let baseLayer=null, areaMask=null, areaRect=null;
function isLight(){return document.body.classList.contains('light');}
function applyBaseLayer(){
  if(baseLayer) baseLayer.remove();
  baseLayer=L.tileLayer(TILE_URL(isLight()),{maxZoom:19}).addTo(map);
  baseLayer.bringToBack();
  // 已下載範圍的遮罩顏色也要隨主題（淺色用淺灰遮罩、深色用近黑）
  if(areaMask) areaMask.setStyle({fillColor:isLight()?'#8a96a6':'#05070a'});
  // 範圍框虛線：亮色底圖用黑、深色底圖用白
  if(areaRect) areaRect.setStyle({color:isLight()?'#000':'#fff'});
}
function setTheme(light,save=true){
  document.body.classList.toggle('light',light);
  if(save) localStorage.setItem('runart_theme',light?'light':'dark');
  applyBaseLayer();
  // 小人外框跟主題（亮黑深白）重繪。try 包住：初始化時本函式會在 pvHead（let）
  // 宣告前被呼叫，落在暫時死區（TDZ）—— 連 typeof 都會拋 ReferenceError、
  // 中斷整個 script。那時還沒有小人，跳過即可。
  try{ if(pvHead) pvPose(!!S.pvActive); }catch(_){}
  // 手繪線也跟主題（淺色黑、深色白）
  const _lc=light?'#000':'#fff';
  try{ if(S.strokes) S.strokes.forEach(st=>st.line&&st.line.setStyle({color:_lc})); }catch(_){}
  try{ if(S.curLine) S.curLine.setStyle({color:_lc}); }catch(_){}
}
// 初始主題：記住的優先，否則跟隨系統設定
(function(){
  const saved=localStorage.getItem('runart_theme');
  const light=saved?saved==='light':window.matchMedia('(prefers-color-scheme: light)').matches;
  setTheme(light,false);
})();
document.getElementById('btnTheme').onclick=()=>setTheme(!isLight());

/* ---------- 中英文切換（i18n） ----------
   靜態文字用 HTML 的 data-en 屬性；動態字串（toast / 進度 / 引導 / 匯出）查下面的表。

const EN=()=>lang==='en';
const tx=(zh,en)=>EN()?en:zh;   // 有插值的字串用這個選字

const STEPS_I18N={
 zh:{

  2:['畫出你想要的圖案','點下方 <b>畫圖</b>，在<b>藍色框線內</b>畫。畫錯可以按復原'],

 },
 en:{
  1:['Choose an area to load','Tap <b>Load Map</b> (top-right), then drag a box on the map'],
  2:['Draw your shape','Tap <b>Draw</b> and draw inside the <b>blue box</b>. Undo if needed'],
  3:['Set start & finish','Tap <b>Start</b> then tap the map; same for Finish'],
  4:['Ready','Tap <b>Generate</b> to snap your shape onto real roads'],
  5:['Done','Save a GPX or image. Tap <b>Edit Shape</b> to change the drawing']
 }
};
const TOASTS_EN={
 '在地圖上拖曳一個方框':'Drag a box on the map',
 '請在藍色框線內畫圖':'Please draw inside the blue box',

 '拖曳框住要刪除的節點':'Drag a box over the nodes to delete',
 '改回點擊選取，可拖曳地圖':'Back to tap-select; you can pan the map',
 '刪掉這些節點後找不到別條路可以繞過去，已自動復原。試著把整段繞路一起框選刪除。':'No alternative road to detour around — auto-reverted. Try box-selecting the whole detour.',
 '無法刪除：這一段剩下的點太少了。':'Cannot delete: too few nodes left in this segment.',
 '已重新沿道路接好':'Re-routed along the roads',
 '沒有可復原的步驟':'Nothing to undo',
 'GPX 已下載':'GPX downloaded','運算引擎已就緒':'Engine ready',
 '地圖下載失敗：目前公用伺服器（Overpass）都很忙碌。請縮小範圍、或等一兩分鐘再試。已下載過的範圍會被記住，可以離線重用。':'Map load failed: the public Overpass servers are all busy. Try a smaller area or wait a minute. Loaded areas are remembered and reusable offline.',
 '這個範圍抓不到可跑的道路（伺服器可能回了空資料）。請換個地點、把範圍放大一點或稍後再試。':'No runnable roads found here (the server may have returned empty data). Try another spot, enlarge the area, or retry later.'
};
const PROG_EN={
 '載入運算引擎…':'Loading engine…','載入數學套件…':'Loading math packages…',
 '載入路網套件…':'Loading graph packages…','載入演算法…':'Loading algorithm…',
 '下載路網（同時向多台伺服器請求）…':'Loading roads (querying several servers)…',
 '伺服器忙碌，重試中…':'Servers busy, retrying…','使用已下載的地圖…':'Using saved map…',
 '建立路網…':'Building road network…','對齊道路中…':'Snapping to roads…',
 '重新接路中…':'Re-routing…','產生圖片…':'Creating image…','查詢地點…':'Finding location…',

};
const PACE_NAMES={zh:['競速','慢跑','輕鬆跑','快走'],en:['Fast','Jog','Easy','Brisk']};
const EXP_LABELS={zh:['距離','配速','預估時間','總爬升／下降'],en:['Distance','Pace','Est. time','Total Elev.']};

function updateDlLabel(){
  // 尚未載入地圖時顯示提示字；載入後由既有流程顯示面積，不覆寫
  if(!S.hasMap && !S.boxing) $('dlLabel').textContent = tx('載入地圖範圍','Load Map');
}
function applyLang(){
  document.querySelectorAll('[data-en]').forEach(eln=>{
    if(eln.dataset.zh==null) eln.dataset.zh=eln.textContent;
    eln.textContent = EN()?eln.dataset.en:eln.dataset.zh;
  });
  document.documentElement.lang = EN()?'en':'zh-Hant';
  $('btnLang').textContent = EN()?'中':'EN';
  localStorage.setItem('runart_lang',lang);
  guide(); paceUI(); updateDlLabel();
  if(S.result&&S.elevGain!=null) $('sElev').textContent='↑'+S.elevGain+' ↓'+S.elevLoss+' m';
}
document.getElementById('btnLang').onclick=()=>{ lang=EN()?'zh':'en'; applyLang(); };

const S={mode:'pan',hasMap:false,strokes:[],cur:null,start:null,end:null,
         boxing:false,generated:false,sheetUp:false,step:1,bounds:null,warned:0,
         editing:false,ebox:false,eDown:null,sel:new Set(),locked:false};
const $=id=>document.getElementById(id);
const el={guide:$('guide'),gn:$('gn'),gt:$('gt'),pill:$('pill'),sheet:$('sheet'),toast:$('toast')};
let routeLayer=null,startMk=null,endMk=null,boxEl=null,boxA=null;

function guide(){
  const s=STEPS_I18N[lang][S.step];
  // 結果面板升起時，引導條與距離膠囊都讓位，避免互相遮擋
  if(S.sheetUp||!s){el.guide.classList.add('hide');return;}
  el.guide.classList.remove('hide');
  el.gn.textContent=S.step;
  el.gt.innerHTML='<b>'+s[0]+'</b><br>'+s[1];
  positionGuide();
}
/* 把引導提示框放到「當前步驟要按的那顆按鈕」旁邊，操作更直覺。
   頂部按鈕→放下方；桌面左側工具列→放右邊；手機底部工具列→放上方。 */
const GUIDE_TARGET={1:'btnDl',2:'mDraw',3:'mStart',4:'btnGo'};
function positionGuide(){
  const g=el.guide;
  g.style.position=g.style.left=g.style.right=g.style.top=g.style.bottom=g.style.width=g.style.maxWidth='';
  if(!S.step) return;

  if(S.step===1){
    const btn=$('btnDl');
    if(!btn) return;
    const r=btn.getBoundingClientRect();
    if(!r.width) return;
    g.style.position='fixed';g.style.right='auto';g.style.bottom='auto';
    g.style.width='auto';
    const gw=Math.min(300, window.innerWidth-24);
    g.style.maxWidth=gw+'px';
    const gh=g.offsetHeight, gwA=Math.min(g.offsetWidth,gw), M=10;
    const top=r.bottom+M;
    const left=Math.min(r.right-gwA, window.innerWidth-gwA-12);
    g.style.left=Math.max(12,left)+'px'; g.style.top=Math.max(12,top)+'px';
    return;
  }

  // 步驟 2, 3, 4 定位在工具欄 (mainDock) 左右側，確保絕不遮擋工具欄
  const dock=$('mainDock');
  if(!dock) return;
  const d=dock.getBoundingClientRect();
  if(!d.width) return;

  g.style.position='fixed';g.style.right='auto';g.style.bottom='auto';g.style.width='auto';
  const gw=Math.min(270, window.innerWidth*0.65);
  g.style.maxWidth=gw+'px';g.style.left='0px';g.style.top='0px';

  const gh=g.offsetHeight, gwA=Math.min(g.offsetWidth,gw);
  let left, top;

  if(S.step===2){
    // 2 號放工具欄左側
    if(d.left >= gwA + 16){
      left = d.left - gwA - 12;
      top = d.top + (d.height - gh)/2;
    }else{
      left = Math.max(12, d.left);
      top = d.top - gh - 10;
    }
  }else{
    // 3, 4 號放工具欄右側
    if(window.innerWidth - d.right >= gwA + 16){
      left = d.right + 12;
      top = d.top + (d.height - gh)/2;
    }else{
      left = Math.min(window.innerWidth - gwA - 12, d.right - gwA);
      top = d.top - gh - 10;
    }
  }

  top = Math.max(12, Math.min(top, window.innerHeight - gh - 12));
  left = Math.max(12, Math.min(left, window.innerWidth - gwA - 12));
  g.style.left = left+'px'; g.style.top = top+'px';
}

function toast(t,ms=1500){

// 把「已下載範圍」永久標示在底圖上：框線 + 框外變暗，
// 使用者一眼就知道自己能畫到哪裡。
function showArea(b){
  const W=[[90,-180],[90,180],[-90,180],[-90,-180]];
  const hole=[b.getNorthWest(),b.getNorthEast(),b.getSouthEast(),b.getSouthWest()];
  if(areaMask) areaMask.remove();
  if(areaRect) areaRect.remove();
  areaMask=L.polygon([W,hole],{stroke:false,fillColor:isLight()?'#8a96a6':'#05070a',
    fillOpacity:.72,interactive:false}).addTo(map);
  areaRect=L.rectangle(b,{color:isLight()?'#000':'#fff',weight:2,dashArray:'7 5',fill:false,interactive:false}).addTo(map);
  // 留出上下非對稱邊距，避免被頂部按鈕或底部工具欄遮擋
  map.fitBounds(b,{paddingTopLeft:[30,64],paddingBottomRight:[30,110]});
}
function inArea(ll){return !S.bounds||S.bounds.contains(ll);}

function setMode(m){
  if(m!=='pan'&&!S.hasMap) return;
  // 生成後鎖住編輯，要先按「修改圖案」或「重新繪製」才能再動
  if(m!=='pan'&&S.locked) return;
  S.mode=m;
  document.querySelectorAll('.m').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  // 模式切換：只有「移動」模式能拖曳地圖
  if(m==='pan'){map.dragging.enable();}else{map.dragging.disable();}
  map.getContainer().style.cursor = m==='pan'?'grab':'crosshair';
}

/* 拖曳畫框（下載範圍與微調框選共用） */
function boxBegin(e){
  boxA=[e.clientX,e.clientY];
  boxEl=document.createElement('div');boxEl.className='box';document.body.appendChild(boxEl);
}
function boxDrag(e){
  if(!boxA||!boxEl) return;
  const x=Math.min(boxA[0],e.clientX),y=Math.min(boxA[1],e.clientY);
  boxEl.style.cssText+=`;left:${x}px;top:${y}px;width:${Math.abs(e.clientX-boxA[0])}px;height:${Math.abs(e.clientY-boxA[1])}px`;
}
/* 收框，回傳 {x0,y0,x1,y1}（相對地圖容器）；沒在畫框就回傳 null */
function boxEnd(e){
  if(!boxA) return null;
  const a=boxA;boxA=null;
  if(boxEl){boxEl.remove();boxEl=null;}
  const r=mc.getBoundingClientRect();
  return {x0:Math.min(a[0],e.clientX)-r.left, y0:Math.min(a[1],e.clientY)-r.top,
          x1:Math.max(a[0],e.clientX)-r.left, y1:Math.max(a[1],e.clientY)-r.top};
}

function updatePillPos(){
  const dock = $('mainDock');
  if(!dock) return;
  const d = dock.getBoundingClientRect();
  if(!d.width) return;
  const bottomDist = Math.max(88, Math.round(window.innerHeight - d.top + 14));
  el.pill.style.bottom = bottomDist + 'px';
}
window.addEventListener('resize', updatePillPos);

function refresh(){
  if(S.editing) return;   // 微調模式有自己的一套按鈕與提示
  const n=S.strokes.length;
  $('btnUndo').disabled=!n||S.locked; $('btnClear').disabled=!n||S.locked;
  $('btnGo').disabled=!(n&&S.start&&S.end)||S.locked;
  ['mDraw','mStart','mEnd'].forEach(i=>$(i).disabled=!S.hasMap||S.locked);
  if(S.locked&&S.mode!=='pan') setMode('pan');

  // 取消修改按鈕：只有在先前有生成結果、且目前退回修改圖案模式時顯示
  if($('btnCancelMod')){
    $('btnCancelMod').style.display = (S.prevResult && !S.sheetUp) ? 'flex' : 'none';
  }

  let d=0;
  for(const s of S.strokes) for(let i=1;i<s.pts.length;i++) d+=map.distance(s.pts[i-1],s.pts[i]);
  if(S.result&&!S.sheetUp){
    // 生成後不能再畫圖，在工具列上方顯示「查看路線結果」按鈕讓使用者點擊叫回
    el.pill.classList.remove('hide');
    el.pill.textContent=tx('▲ 查看路線結果 (','▲ View Result (')+S.km.toFixed(2)+' km)';
    el.pill.classList.add('tap');
    updatePillPos();
  }else if(n&&!S.sheetUp){
    el.pill.classList.remove('hide');
    el.pill.textContent=(d/1000).toFixed(2)+' km';
    el.pill.classList.remove('tap');
    updatePillPos();
  }else{
    el.pill.classList.add('hide');
    el.pill.classList.remove('tap');
  }
  // 引導自動推進，不需要使用者點「下一步」
  let st=1;
  if(S.hasMap) st=2;
  if(S.hasMap&&n) st=3;
  if(S.hasMap&&n&&S.start&&S.end) st=4;
  if(S.generated) st=5;
  if(st!==S.step){S.step=st;guide();}
}

  }
  if(S.mode==='draw'&&S.cur){

    if(!inArea(ll)){
      if(Date.now()-S.warned>1600){S.warned=Date.now();toast('超出已下載範圍');}

mc.addEventListener('pointerup',e=>{
  if(S.editing){
    const d=S.eDown;S.eDown=null;
    if(S.ebox){
      const r=boxEnd(e);
      if(r) editBoxSelect(r);
      return;
    }
    // 移動超過 8px 視為在拖曳地圖，不當成點選節點
    if(d&&Math.hypot(e.clientX-d[0],e.clientY-d[1])<=8) editPick(map.mouseEventToLatLng(e));
    return;
  }
  if(S.boxing&&boxA){
    const r=boxEnd(e);
    if(r&&r.x1-r.x0>30&&r.y1-r.y0>30){
      const p1=map.containerPointToLatLng([r.x0,r.y0]);
      const p2=map.containerPointToLatLng([r.x1,r.y1]);
      const bounds=L.latLngBounds(p1,p2);
      S.boxing=false;$('btnDl').classList.remove('on');
      const km=(map.distance(bounds.getNorthWest(),bounds.getNorthEast())/1000)
             *(map.distance(bounds.getNorthWest(),bounds.getSouthWest())/1000);
      $('dlLabel').textContent=tx('載入中…','Loading…');
      Engine.loadArea(bounds.getSouth(),bounds.getWest(),bounds.getNorth(),bounds.getEast())
        .then(st=>{

          toast(tx('路網已載入（'+st.nodes+' 個路口）','Roads loaded ('+st.nodes+' junctions)'));setMode('draw');refresh();
        })
        .catch(err=>{busy('');updateDlLabel();toast(err.message,3000);});
    }
    return;
  }
  if(S.mode==='draw'&&S.cur){
    if(S.cur.length>3) S.strokes.push({pts:S.cur,line:S.curLine});
    else S.curLine.remove();
    S.cur=null;S.curLine=null;refresh();
  }
});

/* ---------- 生成（原型：假資料） ---------- */
/* ---------- 路線預覽（拉桿 + 方向） ---------- */
let pvDone=null,pvHead=null,pvArrows=null,pvTimer=null,poseT=null;
/* 預覽的「跑者」圖示：靜止＝站立、拖曳／播放中＝雙手舉高。SVG 自己畫，深淺底圖都清楚。 */
function personSVG(active){
  const arms = active
    ? '<path d="M13 12.5 L6.5 6.5"/><path d="M13 12.5 L19.5 6.5"/>'   // 雙手舉高
    : '<path d="M13 12.5 L8 18"/><path d="M13 12.5 L18 18"/>';        // 自然垂下
  // 本體 #4169E1 ＋ 白色外框（深淺模式都一樣），頭 r=3。
  const body='<circle cx="13" cy="5.2" r="3"/><path d="M13 8 L13 19"/>'+arms
            +'<path d="M13 19 L9 27"/><path d="M13 19 L17 27"/>';
  return '<svg width="28" height="32" viewBox="0 0 26 30" style="filter:drop-shadow(0 0 1.4px rgba(0,0,0,.5))">'
    +'<g fill="none" stroke="#fff" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">'+body+'</g>'
    +'<g fill="#4169E1" stroke="#4169E1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+body+'</g>'
    +'</svg>';
}
function personIcon(active){
  return L.divIcon({className:'',iconSize:[28,32],iconAnchor:[14,29],html:personSVG(active)});
}
function pvPose(active){ S.pvActive=active; if(pvHead) pvHead.setIcon(personIcon(active)); }
let S_arrowList = [];

function pvBuild(res){
  // 把所有分段串成一條連續路徑，並累計距離
  S.path=[];
  res.segments.forEach(sg=>sg.pts.forEach(p=>{
    const last=S.path.length?S.path[S.path.length-1]:null;
    if(!last||last[0]!==p[0]||last[1]!==p[1]) S.path.push(p);
  }));
  S.cum=[0];
  for(let i=1;i<S.path.length;i++)
    S.cum.push(S.cum[i-1]+map.distance(S.path[i-1],S.path[i]));
  S.totalM=S.cum[S.cum.length-1]||0;

  [pvDone,pvHead,pvArrows].forEach(l=>{if(l)l.remove();});
  pvDone=L.polyline([],{color:'#4169E1',weight:8,opacity:.95}).addTo(map);
  pvHead=L.marker(S.path[0],{icon:personIcon(false),interactive:false,zIndexOffset:1000}).addTo(map);

  // 箭頭規則：每 200m 一個。若相鄰兩點距離 < 30m 則跳過改到下一段。走過的路段自動隱藏。
  // 配色：鮮青色 #00E5FF（完美搭配 #4169E1 藍與 #708090 灰），粗 > 造型（stroke-width: 4.2）
  const arrows = [];
  S_arrowList = [];
  const step = 200;
  for(let targetD = step; targetD < S.totalM - 20; targetD += step){
    const i = pvIndexAt(targetD);
    if(i < 1) continue;
    const a = S.path[i-1], b = S.path[i];
    const segLen = S.cum[i] - S.cum[i-1];
    if(segLen < 30) continue;   // 小於 30m 跳過

    const mid = [(a[0] + b[0])/2, (a[1] + b[1])/2];
    const pa = map.project(a, 18), pb = map.project(b, 18);
    if(pa.x === pb.x && pa.y === pb.y) continue;
    const dir = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI;

    const mk = L.marker(mid, {
      interactive: false,
      icon: L.divIcon({
        className: '',
        iconSize: [24, 24],
        iconAnchor: [12, 12],
        html: '<svg width="24" height="24" viewBox="0 0 24 24" style="transform:rotate('+dir+'deg);overflow:visible;filter:drop-shadow(0 0 1.6px rgba(0,0,0,.7))"><path d="M 6 4 L 17 12 L 6 20" stroke="#00E5FF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'
      })
    });
    arrows.push(mk);
    S_arrowList.push({ d: targetD, mk });
  }

  pvArrows = L.layerGroup(arrows).addTo(map);
  $('pvSlider').value = 0; pvSet(0);
}
const PV_PROJ_Z=18;
function pvHeading(d){
  if(!S.path||S.path.length<2) return null;
  const a=S.path[pvIndexAt(Math.max(0,d-20))];
  const b=S.path[Math.min(pvIndexAt(Math.min(S.totalM,d+20)),S.path.length-1)];
  if(!a||!b||(a[0]===b[0]&&a[1]===b[1])) return null;
  const pa=map.project(a,PV_PROJ_Z),pb=map.project(b,PV_PROJ_Z);
  return Math.atan2(pb.y-pa.y,pb.x-pa.x)*180/Math.PI;
}
function pvIndexAt(dist){
  let lo=0,hi=S.cum.length-1;
  while(lo<hi){const mid=(lo+hi)>>1; if(S.cum[mid]<dist) lo=mid+1; else hi=mid;}
  return lo;
}
function pvSet(frac){
  if(!S.path||!S.path.length) return;
  const target=S.totalM*frac;
  const i=pvIndexAt(target);
  const shown=S.path.slice(0,Math.max(i+1,1));
  let head=S.path[Math.max(i,0)];
  if(i>0){
    const seg=S.cum[i]-S.cum[i-1];
    const t=seg>0?(target-S.cum[i-1])/seg:0;
    const a=S.path[i-1],b=S.path[i];
    head=[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
    shown[shown.length-1]=head;
  }
  pvDone.setLatLngs(shown);
  pvHead.setLatLng(head);
  $('pvAt').textContent=(target/1000).toFixed(2)+' km';
  $('pvPct').textContent=Math.round(frac*100)+'%';

  // 已走過路段動態隱藏箭頭，僅保留前景路段箭頭
  S_arrowList.forEach(item => {
    if(!item.mk || !item.mk.getElement()) return;
    item.mk.getElement().style.display = (item.d <= target) ? 'none' : '';
  });

  const pct=(frac*100).toFixed(1);
  $('pvSlider').style.background=
    `linear-gradient(to right,#4169E1 0%,#4169E1 ${pct}%,#708090 ${pct}%,#708090 100%)`;

  updateElevRunnerDot(frac);
}
$('pvSlider').oninput=e=>{
  pvStop();pvSet(+e.target.value/1000);
  // 拖曳中＝雙手舉高，放開一下子後回到站立
  pvPose(true); clearTimeout(poseT); poseT=setTimeout(()=>pvPose(false),320);
};
function pvStop(){if(pvTimer){clearInterval(pvTimer);pvTimer=null;$('pvPlay').textContent='▶';} pvPose(false);}
$('pvPlay').onclick=()=>{
  if(pvTimer){pvStop();return;}
  if(+$('pvSlider').value>=1000) $('pvSlider').value=0;
  $('pvPlay').textContent='⏸';
  pvPose(true);   // 播放中＝奔跑（雙手舉高）
  pvTimer=setInterval(()=>{
    // 前進速度跟著配速：配速越慢（S.pace 越大）小人跑越慢。
    // 等於把真實跑步時間壓縮成固定比例（約 1/120）播放。
    const vMps = S.pace>0 ? 1000/(S.pace*60) : 2.8;   // 真實跑步 m/s
    const stepM = vMps * 120 * 0.04;                   // 每 40ms 前進的公尺
    const inc = S.totalM>0 ? (stepM/S.totalM)*1000 : 8;
    let v=+$('pvSlider').value+inc;
    if(v>=1000){v=1000;pvStop();}
    $('pvSlider').value=v;pvSet(v/1000);
  },40);
};

/* ---------- 配速（可調，會記住） ---------- */
S.pace=parseFloat(localStorage.getItem('runart_pace'))||6;   // 分鐘/公里
S.km=0;
function paceName(p){
  const i = p<=4.5?0 : p<=6.5?1 : p<=9?2 : 3;
  return PACE_NAMES[lang][i];
}
function paceUI(){

$('pDn').onclick=()=>{S.pace=Math.min(15,+(S.pace+0.5).toFixed(1));paceUI();};

/* ---------- 生成（真實運算） ---------- */
/* 套用一份運算結果（生成與微調共用）。微調時不重建預覽，
   否則預覽圖層會蓋住要點選的節點。 */
function applyResult(res,withPreview=true){
  S.result=res;
  if(routeLayer) routeLayer.remove();
  const layers=[];
  res.segments.forEach(sg=>{
    if(sg.kind==='draw'){
      layers.push(L.polyline(sg.pts,{color:'#708090',weight:9,opacity:.95}));
    }else{
      // 連接段（起點→路線、路線→終點、筆畫之間）：細的淺灰虛線，和道路(路網)顏色區分。
      layers.push(L.polyline(sg.pts,{color:'#cbd5e1',weight:2.5,opacity:.95,dashArray:'7 6'}));
    }
  });
  routeLayer=L.layerGroup(layers).addTo(map);
  S.km=res.total_m/1000;
  $('sDist').textContent=S.km.toFixed(2)+' km';
  $('sFit').textContent=Math.round(res.fit)+'%';
  paceUI();
  if(withPreview) pvBuild(res);
}
function pvClear(){
  pvStop();
  [pvDone,pvHead,pvArrows].forEach(l=>{if(l)l.remove();});
  pvDone=pvHead=pvArrows=null;
}
/* ---------- 預估爬升／下降 ----------
   用 Open-Meteo 免費高程 API（有 CORS，一次最多 100 點）查整條路線的高度，
   加總正的落差＝爬升、負的＝下降。DEM 解析度較粗，城市路線通常起伏不大屬正常。 */
let elevChartData = null;

function alignElevChart(){
  const slider = $('pvSlider');
  const elevBox = $('elevBox');
  const area = $('elevChartArea');
  if(!slider || !elevBox || !area) return;
  const sliderRect = slider.getBoundingClientRect();
  const elevRect = elevBox.getBoundingClientRect();
  if(sliderRect.width > 0 && elevRect.width > 0){
    const leftOffset = Math.max(0, sliderRect.left - elevRect.left);
    area.style.marginLeft = leftOffset.toFixed(1) + 'px';
    area.style.width = sliderRect.width.toFixed(1) + 'px';
  }
}

function renderElevChart(data){
  const area = $('elevChartArea');
  if(!area) return;
  if(!data || !data.elevations || data.elevations.length < 2){
    if($('elevBox')) $('elevBox').style.display = 'none';
    return;
  }
  if($('elevBox')) $('elevBox').style.display = 'flex';
  elevChartData = data;
  alignElevChart();

  const elevations = data.elevations;
  let minE = Infinity, maxE = -Infinity, minIdx = 0, maxIdx = 0;
  elevations.forEach((e, i) => {
    if(e < minE){ minE = e; minIdx = i; }
    if(e > maxE){ maxE = e; maxIdx = i; }
  });
  const rangeE = Math.max(10, maxE - minE);

  if($('elevRangeText')) $('elevRangeText').textContent = tx('最高 ','Max ') + Math.round(maxE) + tx(' m / 最低 ',' m / Min ') + Math.round(minE) + ' m';

  const W = 340, H = 60, padT = 14, padB = 8;
  const chartW = W, chartH = H - padT - padB;

  const pts = elevations.map((e, idx) => {
    const x = (idx / (elevations.length - 1)) * chartW;
    const y = padT + chartH - ((e - minE) / rangeE) * chartH;
    return { x, y, e, idx };
  });

  const pathStr = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`);
  const lineD = 'M ' + pathStr.join(' L ');
  const areaD = `M 0,${H - padB} L ` + pathStr.join(' L ') + ` L ${W},${H - padB} Z`;

  const minPt = pts[minIdx];
  const maxPt = pts[maxIdx];

  area.innerHTML = `
    <svg class="elev-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="elevGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.03"/>
        </linearGradient>
      </defs>
      <path d="${areaD}" fill="url(#elevGrad)"/>
      <path d="${lineD}" fill="none" stroke="#00E5FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${maxPt.x.toFixed(1)}" cy="${maxPt.y.toFixed(1)}" r="2.8" fill="#00E5FF"/>
      <text x="${Math.max(26, Math.min(W - 26, maxPt.x)).toFixed(1)}" y="${Math.max(10, maxPt.y - 3).toFixed(1)}" fill="#00E5FF" font-size="9" font-weight="700" text-anchor="middle">▲${Math.round(maxE)}m</text>
      <circle cx="${minPt.x.toFixed(1)}" cy="${minPt.y.toFixed(1)}" r="2.8" fill="#8b929c"/>
      <text x="${Math.max(26, Math.min(W - 26, minPt.x)).toFixed(1)}" y="${Math.min(H - 1, minPt.y + 8.5).toFixed(1)}" fill="var(--dim)" font-size="8.5" font-weight="600" text-anchor="middle">▼${Math.round(minE)}m</text>
    </svg>
    <div id="elevRunnerDot"></div>
  `;

  updateElevRunnerDot(S.totalM > 0 && $('pvSlider') ? +$('pvSlider').value / 1000 : 0);
}

function updateElevRunnerDot(frac){
  if(!elevChartData || !elevChartData.elevations) return;
  const dot = $('elevRunnerDot');
  if(!dot) return;
  const elevations = elevChartData.elevations;
  let minE = Infinity, maxE = -Infinity;
  elevations.forEach(e => {
    if(e < minE) minE = e;
    if(e > maxE) maxE = e;
  });
  const rangeE = Math.max(10, maxE - minE);

  const padT = 14, padB = 8;
  const area = $('elevChartArea');
  if(!area) return;
  const W = area.offsetWidth || 340, H = area.offsetHeight || 60;
  const chartH = H - padT - padB;

  const idxFloat = Math.max(0, Math.min(1, frac)) * (elevations.length - 1);
  const idx = Math.floor(idxFloat);
  const t = idxFloat - idx;
  const e1 = elevations[Math.min(idx, elevations.length - 1)];
  const e2 = elevations[Math.min(idx + 1, elevations.length - 1)];
  const e = e1 + (e2 - e1) * t;

  const x = frac * W;
  const y = padT + chartH - ((e - minE) / rangeE) * chartH;

  dot.style.left = x.toFixed(1) + 'px';
  dot.style.top = y.toFixed(1) + 'px';
}

let elevSeq=0;
async function updateElevation(){
  if(!S.result){renderElevChart(null);return;}
  const path=[];
  S.result.segments.forEach(sg=>sg.pts.forEach(p=>{
    const last=path.length?path[path.length-1]:null;
    if(!last||last[0]!==p[0]||last[1]!==p[1]) path.push(p);
  }));
  if(path.length<2){$('sElev').textContent='–';renderElevChart(null);return;}
  const N=Math.min(100,path.length);
  const samp=[];
  for(let i=0;i<N;i++) samp.push(path[Math.round(i*(path.length-1)/(N-1))]);
  const seq=++elevSeq;
  $('sElev').textContent=tx('計算中…','Calculating…');
  try{
    const lat=samp.map(p=>p[0].toFixed(5)).join(',');
    const lon=samp.map(p=>p[1].toFixed(5)).join(',');
    const ctrl=new AbortController();const tm=setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch('https://api.open-meteo.com/v1/elevation?latitude='+lat+'&longitude='+lon,{signal:ctrl.signal});
    clearTimeout(tm);
    const e=(await r.json()).elevation;
    if(seq!==elevSeq) return;
    if(!e||!e.length) throw 0;
    let up=0,down=0;
    for(let i=1;i<e.length;i++){const d=e[i]-e[i-1]; if(d>0)up+=d; else down-=d;}
    S.elevGain=Math.round(up); S.elevLoss=Math.round(down);
    $('sElev').textContent='↑'+S.elevGain+' ↓'+S.elevLoss+' m';
    renderElevChart({ elevations: e });
  }catch(_){
    if(seq===elevSeq){ S.elevGain=null;S.elevLoss=null; $('sElev').textContent='–'; renderElevChart(null); }
  }
}
/* 把視野拉到路線上，並讓開結果面板與頂端按鈕 */

/* ---------- 微調路徑 ---------- */
/* 節點畫在 canvas 上（幾百個 SVG 圓在手機上會很鈍），指定 pane: 'markerPane' 確保於路線上層 */
let nodeRenderer=null;
const NODE_R=4, NODE_SEL_R=9, NODE_TURN_R=7.5, PICK_TOL_PX=24;
const TURN_DEG=28;   // 轉多少度才算「轉彎點」
let nodeLayer=null, nodeMks=[];

/* 找出一串節點裡哪些是「轉彎點」：用投影後的平面角度，避免 Mercator 拉伸。
   回傳與 latlngs 等長的布林陣列。 */
function turnFlags(latlngs){
  const f=new Array(latlngs.length).fill(false);
  const pr=ll=>map.project(ll,18);
  for(let i=1;i<latlngs.length-1;i++){
    const a=latlngs[i-1],b=latlngs[i],c=latlngs[i+1];
    if(!a||!b||!c) continue;
    const pa=pr(a),pb=pr(b),pc=pr(c);
    let d=Math.abs(Math.atan2(pc.y-pb.y,pc.x-pb.x)-Math.atan2(pb.y-pa.y,pb.x-pa.x))*180/Math.PI;
    if(d>180) d=360-d;
    if(d>=TURN_DEG) f[i]=true;
  }
  return f;
}
// 一個節點沒被選取時該有的樣式（轉彎點醒目、其餘小而淡）
function nodeStyle(turn){
  return turn
    ? {radius:NODE_TURN_R,color:'#fff',weight:2,fillColor:'#fb923c',fillOpacity:1}
    : {radius:NODE_R,color:'#facc15',weight:1,fillColor:'#facc15',fillOpacity:.5};
}
function editBuild(){
  if(nodeLayer) nodeLayer.remove();
  nodeMks=[];S.sel.clear();
  if(!nodeRenderer){
    try { nodeRenderer = L.canvas({padding:.3, pane:'markerPane'}); }
    catch(_) { nodeRenderer = L.canvas({padding:.3}); }
  }
  const marks=[];
  for(const sg of S.result.segments){
    const flags=turnFlags(sg.nodes||[]);   // 只把轉彎點標出來
    (sg.nodes||[]).forEach((ll,n)=>{
      if(!ll) return;   // null 佔位：這個節點不在路網裡，不能編輯
      const turn=!!flags[n];
      // 指定 pane: 'markerPane' 讓節點永遠顯示於路線 Layer 之上
      const mk=L.circleMarker(ll,{pane:'markerPane',renderer:nodeRenderer,interactive:false,...nodeStyle(turn)});
      nodeMks.push({si:sg.si,n,ll,mk,turn});
      marks.push(mk);
    });
  }
  nodeLayer=L.layerGroup(marks,{pane:'markerPane'}).addTo(map);
  if(nodeRenderer && nodeRenderer._container) nodeRenderer._container.style.zIndex = '750';
  if(nodeLayer) nodeLayer.bringToFront();
  editUI();
}
function editMark(i,on){
  const d=nodeMks[i];
  if(on) d.mk.setStyle({radius:NODE_SEL_R,color:'#ef4444',weight:1,fillColor:'#ef4444',fillOpacity:1});
  else d.mk.setStyle(nodeStyle(d.turn));
}
function editUI(){
  const n=S.sel.size;
  $('eDel').disabled=!n;$('eNone').disabled=!n;
  $('eUndo').disabled=!(S.result&&S.result.undo);
  el.pill.classList.remove('hide');
  el.pill.textContent=n?tx('已選 '+n+' 個節點',n+' selected'):tx(nodeMks.length+' 個可調整的節點',nodeMks.length+' editable nodes');
}
function editPick(ll){
  const p0=map.latLngToContainerPoint(ll);
  let best=-1,bd=1e9;
  nodeMks.forEach((d,i)=>{
    const p=map.latLngToContainerPoint(d.ll);
    const dist=Math.hypot(p.x-p0.x,p.y-p0.y);
    if(dist<bd){bd=dist;best=i;}
  });
  if(best<0||bd>PICK_TOL_PX) return;
  if(S.sel.has(best)) S.sel.delete(best); else S.sel.add(best);
  editMark(best,S.sel.has(best));editUI();
}
function editBoxSelect(r){
  if(r.x1-r.x0<6&&r.y1-r.y0<6) return;
  nodeMks.forEach((d,i)=>{
    if(S.sel.has(i)) return;
    const p=map.latLngToContainerPoint(d.ll);
    if(p.x>=r.x0&&p.x<=r.x1&&p.y>=r.y0&&p.y<=r.y1){S.sel.add(i);editMark(i,true);}
  });
  editUI();
}

/* ---------- 匯出圖片 ----------
   把底圖 tile 自己抓下來畫進 canvas。CARTO 通常會回 Access-Control-Allow-Origin: *，
   但不能假設一定有（快取層、企業 proxy、離線重送都可能吃掉那個標頭），
   少了它 canvas 就會被「污染 (tainted)」而 toBlob/toDataURL 直接丟 SecurityError。
   所以圖磚一律走 fetch→blob 這條路（見 loadTile），並在匯出時做污染偵測 + 自動降級。
   不依賴任何額外函式庫。 */
const TILE_HOSTS=['a','b','c','d'];
const TILE_SIZE=256;          // 一個 tile 代表的「世界像素」
const INFO_H=250;             // 底部資訊欄高度（寬固定 1080）
// 社群媒體常見比例。寬一律 1080，資訊欄固定在最底部，地圖區 = 寬 × (高−資訊欄)。
const PNG_RATIOS={'1:1':[1080,1080],'4:5':[1080,1350],'9:16':[1080,1920]};

/* 反向地理編碼：把座標變成「中山區, 台北市」。用 OSM 的 Nominatim（有 CORS）。
   結果快取在記憶體，失敗就回空字串、不影響出圖。 */
const _placeCache={};
async function getPlaceName(lat,lon){
  const key=lang+':'+lat.toFixed(3)+','+lon.toFixed(3);   // 語言不同要分開快取
  if(key in _placeCache) return _placeCache[key];
  try{
    const ctrl=new AbortController();const tm=setTimeout(()=>ctrl.abort(),7000);
    const u='https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14'+
            '&accept-language='+(EN()?'en':'zh-TW')+'&lat='+lat+'&lon='+lon;
    const r=await fetch(u,{signal:ctrl.signal});clearTimeout(tm);
    if(!r.ok) throw 0;
    const a=(await r.json()).address||{};
    const district=a.city_district||a.suburb||a.borough||a.district||a.town||a.city_block||a.quarter||a.village||a.neighbourhood||'';
    const city=a.city||a.county||a.state||a.province||'';
    const parts=[];
    if(district) parts.push(district);
    if(city&&city!==district) parts.push(city);
    // 臺→台：Nominatim 中文回「臺北市」，一般習慣寫「台北市」（英文不用替換）
    const name=EN()?parts.join(', '):parts.join(', ').replace(/臺/g,'台');
    _placeCache[key]=name;
    return name;
  }catch(_){ _placeCache[key]=''; return ''; }
}

/* 本地日期。toISOString() 是 UTC，台灣 +8 在半夜會退成前一天，
   檔名和圖上日期都會顯示昨天。 */
function localDate(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
         +'-'+String(d.getDate()).padStart(2,'0');
}
function lonToWorld(lon,z){return (lon+180)/360*TILE_SIZE*Math.pow(2,z);}
function latToWorld(lat,z){
  const r=lat*Math.PI/180;
  return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*TILE_SIZE*Math.pow(2,z);
}
function tileURL(z,x,y,i,style){
  return `https://${TILE_HOSTS[i%TILE_HOSTS.length]}.basemaps.cartocdn.com/${style}/${z}/${x}/${y}@2x.png`;
}
/* 第一順位：fetch → blob → 解碼。blob 是同源資料，畫進 canvas 永遠不會污染它，
   所以只要這條路走得通，匯出就一定不會踩到 tainted canvas。 */
async function fetchTileBitmap(url){
  const ctrl=new AbortController();
  const tm=setTimeout(()=>ctrl.abort(),12000);   // 沒有 timeout 的話單顆慢 tile 會卡住整張圖
  try{
    const r=await fetch(url,{mode:'cors',credentials:'omit',signal:ctrl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const blob=await r.blob();
    if(window.createImageBitmap) return await createImageBitmap(blob);
    // 舊 Safari 沒有 createImageBitmap：改用 blob: URL 的 <img>，一樣是同源不污染
    const u=URL.createObjectURL(blob);
    try{
      return await new Promise((res,rej)=>{
        const im=new Image();
        im.onload=()=>res(im);im.onerror=()=>rej(new Error('decode failed'));
        im.src=u;
      });
    }finally{ setTimeout(()=>URL.revokeObjectURL(u),20000); }   // 太早 revoke 會讓還沒畫完的圖變空白
  }finally{ clearTimeout(tm); }
}
// 第二順位：<img crossOrigin>。伺服器有回 ACAO 就同樣安全，順便繞過 fetch 被擋的情況。
function corsTileImage(url){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.crossOrigin='anonymous';
    im.onload=()=>res(im);im.onerror=()=>rej(new Error('img failed'));
    im.src=url;
  });
}
/* 兩段式備援；兩條都失敗就回 null，那一格留底色。
   刻意不退回「不設 crossOrigin 的 <img>」——那雖然畫得出來，但會污染 canvas
   讓整張圖匯不出去。缺一格 tile 遠比整張匯出失敗好。 */
async function loadTile(z,x,y,i,style){
  const url=tileURL(z,x,y,i,style);
  try{ return await fetchTileBitmap(url); }catch(_){}
  try{ return await corsTileImage(url); }catch(_){}
  return null;
}

/* ctx.filter 在舊版 Safari 沒有實作（設了會被無聲忽略），深色圖磚就不會被提亮。
   偵測一次，不支援時改用「加法疊圖」模擬 brightness(k)：
   正常畫 1 次 + 用 'lighter' 再疊 (k−1) 次，數學上等於逐通道乘 k 後截斷。 */
const CTX_FILTER_OK=(()=>{
  try{
    const c=document.createElement('canvas').getContext('2d');
    c.filter='brightness(2)';
    return c.filter==='brightness(2)';
  }catch(_){ return false; }
})();
/* 把圖磚畫上去並提亮。rectOf(job) 要回 {x,y,w,h}。 */
function paintTiles(ctx,jobs,imgs,rectOf,bright){
  const pass=(alpha,mode)=>{
    ctx.save();
    ctx.globalAlpha=alpha;ctx.globalCompositeOperation=mode;
    jobs.forEach((j,n)=>{
      if(!imgs[n]) return;                       // 這格載入失敗，留底色
      const r=rectOf(j);
      ctx.drawImage(imgs[n],r.x,r.y,r.w,r.h);
    });
    ctx.restore();
  };
  if(bright<=1.001){ pass(1,'source-over'); return; }
  if(CTX_FILTER_OK){
    ctx.save();
    ctx.filter=`brightness(${bright}) contrast(0.92)`;
    pass(1,'source-over');
    ctx.restore();
    return;
  }
  pass(1,'source-over');
  for(let left=bright-1;left>0.001;){
    const a=Math.min(1,left);
    pass(a,'lighter');
    left-=a;
  }
}
// 匯出圖片的地圖大頭針（畫在資訊欄地點名稱左邊）
function drawPin(ctx,cx,tipY,h,color){
  const r=h*0.34, cy=tipY-h+r;
  ctx.save();
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx-r*0.72,cy+r*0.52);ctx.lineTo(cx+r*0.72,cy+r*0.52);ctx.lineTo(cx,tipY);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,r*0.42,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// 匯出圖上的小人（canvas 版，對應地圖上的 personSVG）：橘色本體＋主題色外框，
// footY 是腳底、對準路線上的當前位置。
function drawRunnerCanvas(ctx,x,footY,u,light){
  const oc=light?'#000':'#fff';
  const headY=footY-24*u, hipY=footY-12*u, hr=3.4*u;
  const limbs=()=>{ctx.beginPath();
    ctx.moveTo(x,headY+hr);ctx.lineTo(x,hipY);              // 身體
    ctx.moveTo(x,hipY-5*u);ctx.lineTo(x-5*u,hipY+u);        // 左手
    ctx.moveTo(x,hipY-5*u);ctx.lineTo(x+5*u,hipY+u);        // 右手
    ctx.moveTo(x,hipY);ctx.lineTo(x-4*u,footY);             // 左腿
    ctx.moveTo(x,hipY);ctx.lineTo(x+4*u,footY);ctx.stroke();// 右腿
  };
  // 本體 #4169E1 ＋ 白外框（深淺模式都一樣）
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash([]);
  ctx.strokeStyle='#fff';ctx.lineWidth=5.4*u;limbs();
  ctx.beginPath();ctx.arc(x,headY,hr+1.1*u,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle='#4169E1';ctx.lineWidth=3*u;limbs();
  ctx.beginPath();ctx.arc(x,headY,hr,0,Math.PI*2);ctx.fillStyle='#4169E1';ctx.fill();
  ctx.restore();
}

// 匯出/預覽的方向箭頭：在已 translate+rotate 的座標系畫指向右的大於符號 (>)（耀黃 #FFD700）
function drawChevron(ctx,base){
  const w=base*1.4, h=base*1.4;
  ctx.beginPath();
  ctx.moveTo(-h/2,-w/2);
  ctx.lineTo(h/2,0);
  ctx.lineTo(-h/2,w/2);
  ctx.strokeStyle='#FFD700';
  ctx.lineWidth=Math.max(2.2, base*0.45);
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.stroke();
}

/* 只負責「畫出」成品 canvas；抓圖磚、下載、錯誤處理都不在這裡。
   拆開來的原因：底圖若造成 canvas 污染，exportPNG 需要能用 basemap:false 再畫一次。 */
async function renderExportCanvas(opt){
  const [W,H]=PNG_RATIOS[opt.ratio]||PNG_RATIOS['1:1'];
  const sc=W/1080;                   // 寬固定 1080，sc=1；保留以便日後改寬
  const dats=(opt.dats||['dist','pace','time','elev']).filter(Boolean);
  const showInfo=dats.length>0;
  const infoH=showInfo?INFO_H:0;     // 數據全關＝不畫資訊欄、地圖佔滿整張（配合透明背景做純路線圖）
  const mapW=W, mapH=H-infoH;

  // 圖片跟著 App 的深／淺色主題走
  const light=isLight();
  const TH=light?{
    tile:'light_all', tileBright:1, mapBg:'#e8ecf1',
    infoBg:'#ffffff', infoLine:'#dfe4ea', textMain:'#1a1d22', textDim:'#6b727d',
    overlay:'#1a1d22', overlayStroke:'rgba(255,255,255,.85)'
  }:{
    tile:'dark_all', tileBright:2.3, mapBg:'#262a30',
    infoBg:'#14171c', infoLine:'#2b313b', textMain:'#f4f6f8', textDim:'#8b929c',
    overlay:'#fff', overlayStroke:'rgba(0,0,0,.75)'
  };

  // 1) 要涵蓋的地理範圍
  const pts=[];
  if(opt.route) S.result.segments.forEach(sg=>sg.pts.forEach(p=>pts.push(p)));
  if(opt.draw)  S.strokes.forEach(s=>s.pts.forEach(p=>pts.push([p.lat,p.lng])));
  if(!pts.length) S.result.segments.forEach(sg=>sg.pts.forEach(p=>pts.push(p)));
  if(opt.marks){
    if(S.start) pts.push([S.start.lat,S.start.lng]);
    if(S.end)   pts.push([S.end.lat,S.end.lng]);
  }
  const lats=pts.map(p=>p[0]), lons=pts.map(p=>p[1]);

  // 2) 在「世界像素(z0)」裡算，避免經緯度在 Mercator 上被拉伸
  const wx0=lonToWorld(Math.min(...lons),0), wx1=lonToWorld(Math.max(...lons),0);
  const wy0=latToWorld(Math.max(...lats),0), wy1=latToWorld(Math.min(...lats),0);
  const cx=(wx0+wx1)/2, cy=(wy0+wy1)/2;
  const dx=Math.max(wx1-wx0,1e-9)*1.16, dy=Math.max(wy1-wy0,1e-9)*1.16;  // 8% 邊界

  // 3) 把路線「置中」塞進地圖區：保留路線真實比例，四周由底圖填滿。
  //    比例是固定的（1:1／4:5／9:16），所以路線不會被壓扁，只是留白多寡不同。
  const s=Math.min(mapW/dx, mapH/dy)*0.9;    // canvas px / z0世界px；0.9 留邊
  const z=Math.max(1,Math.min(19,Math.floor(Math.log2(s))));
  const K=s/Math.pow(2,z);                    // 落在 [1,2)，@2x tile 縮小繪製最清晰
  const cxZ=cx*Math.pow(2,z), cyZ=cy*Math.pow(2,z);
  const X=lon=>mapW/2+(lonToWorld(lon,z)-cxZ)*K;
  const Y=lat=>mapH/2+(latToWorld(lat,z)-cyZ)*K;

  const cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  let tilesFailed=false;
  // 地圖區底色：basemap 開＝純色(稍後 tile 蓋滿)、關＝保持透明(做去背 PNG)
  if(opt.basemap){ ctx.fillStyle=TH.mapBg;ctx.fillRect(0,0,mapW,mapH); }

  // 4) 底圖（提亮，讓道路看得清楚，與 App 內一致）；opt.basemap 關閉時透明
  ctx.save();ctx.beginPath();ctx.rect(0,0,mapW,mapH);ctx.clip();
  if(opt.basemap){
    const tx0=Math.floor((cxZ-(mapW/2)/K)/TILE_SIZE), tx1=Math.floor((cxZ+(mapW/2)/K)/TILE_SIZE);
    const ty0=Math.floor((cyZ-(mapH/2)/K)/TILE_SIZE), ty1=Math.floor((cyZ+(mapH/2)/K)/TILE_SIZE);
    const jobs=[];let ji=0;
    for(let tx=tx0;tx<=tx1;tx++) for(let ty=ty0;ty<=ty1;ty++) jobs.push({tx,ty,i:ji++});
    busy('下載底圖…');
    const imgs=await Promise.all(jobs.map(j=>loadTile(z,j.tx,j.ty,j.i,TH.tile)));
    const ts=TILE_SIZE*K;
    paintTiles(ctx,jobs,imgs,
      j=>({x:mapW/2+(j.tx*TILE_SIZE-cxZ)*K, y:mapH/2+(j.ty*TILE_SIZE-cyZ)*K, w:ts+1, h:ts+1}),
      TH.tileBright);
    // 一格都沒抓到就等於沒有底圖：回報給呼叫端，讓它能提醒使用者而不是默默給張空白底
    if(jobs.length && imgs.every(im=>!im)) tilesFailed=true;
    busy('產生圖片…');
  }

  // 5) 手繪紅線。路線通常正好貼著它跑，所以紅線要畫得比路線寬、
  //    當成路線底下透出來的光暈，否則會被藍線整條蓋掉、勾了也看不見。
  ctx.lineJoin=ctx.lineCap='round';
  if(opt.draw){
    ctx.strokeStyle=light?'#000':'#fff';
    ctx.lineWidth=(opt.route?15:5)*sc;
    ctx.globalAlpha=.9;   // 別用半透明會暗成醬紅色，這裡只是壓一點點
    S.strokes.forEach(st=>{
      ctx.beginPath();
      st.pts.forEach((p,k)=>{const x=X(p.lng),y=Y(p.lat);k?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      ctx.stroke();
    });
    ctx.globalAlpha=1;
  }
  // 6) 路線：先畫完整路線當「未走過」底層（draw 灰藍實線 #708090、連接段橘虛線），
  //    再把「走過」的部分（到拉桿位置 frac）蓋成藍實線 #4169E1，並記住小人位置，
  //    和地圖上的預覽一模一樣（小人走到哪、藍線就到哪）。
  let runnerHead=null;
  if(opt.route){
    S.result.segments.forEach(sg=>{
      const draw=sg.kind==='draw';
      ctx.strokeStyle=draw?'#708090':'#cbd5e1';
      ctx.lineWidth=(draw?10.5:2.5)*sc;
      ctx.setLineDash(draw?[]:[10*sc,9*sc]);
      ctx.beginPath();
      sg.pts.forEach((p,k)=>{const x=X(p[1]),y=Y(p[0]);k?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      ctx.stroke();
    });
    ctx.setLineDash([]);
    const frac=(opt.frac!=null)?opt.frac:1;
    if(S.path&&S.path.length>1&&S.totalM>0&&frac>0){
      const target=S.totalM*frac;
      let lo=0,hi=S.cum.length-1;while(lo<hi){const m=(lo+hi)>>1;S.cum[m]<target?lo=m+1:hi=m;}
      const idx=lo;
      const shown=S.path.slice(0,Math.max(idx+1,1)).map(p=>[p[0],p[1]]);
      let head=S.path[Math.max(idx,0)];
      if(idx>0){
        const seg=S.cum[idx]-S.cum[idx-1],t=seg>0?(target-S.cum[idx-1])/seg:0;
        const a=S.path[idx-1],b=S.path[idx];
        head=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
        shown[shown.length-1]=head;
      }
      ctx.strokeStyle='#4169E1';ctx.lineWidth=8*sc;ctx.setLineDash([]);
      ctx.beginPath();
      shown.forEach((p,k)=>{const x=X(p[1]),y=Y(p[0]);k?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      ctx.stroke();
      if(frac<1) runnerHead=head;   // 跑完(100%)就不畫小人，避免杵在終點
    }
  }
  // 7) 方向箭頭：每 200m 一個、<30m 跳過、走過路段不顯示，鮮青色 #00E5FF 粗線 >
  if(opt.arrows && S.path && S.path.length >= 2 && S.totalM > 0){
    const frac = (opt.frac != null) ? opt.frac : 1;
    const curD = S.totalM * frac;
    const step = 200;
    for(let targetD = step; targetD < S.totalM - 20; targetD += step){
      if(targetD <= curD) continue;   // 已走過路段不顯示箭頭
      const i = pvIndexAt(targetD);
      if(i < 1) continue;
      const a = S.path[i-1], b = S.path[i];
      const segLen = S.cum[i] - S.cum[i-1];
      if(segLen < 30) continue;   // 兩節點小於 30m 跳過
      const mid = [(a[0] + b[0])/2, (a[1] + b[1])/2];
      const ax = X(a[1]), ay = Y(a[0]), bx = X(b[1]), by = Y(b[0]);
      if(ax === bx && ay === by) continue;
      ctx.save();
      ctx.translate(X(mid[1]), Y(mid[0]));
      ctx.rotate(Math.atan2(by - ay, bx - ax));
      drawChevron(ctx, 6 * sc);
      ctx.restore();
    }
  }
  // 8) 起終點：綠圈▶＝起點、紅圈■＝終點（與地圖上同一套）
  if(opt.marks){
    const mark=(ll,isStart)=>{
      if(!ll) return;
      const x=X(ll.lng),y=Y(ll.lat),r=15*sc;
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=isStart?'#16a34a':'#dc2626';ctx.fill();
      ctx.lineWidth=3*sc;ctx.strokeStyle='#fff';ctx.stroke();
      ctx.fillStyle='#fff';
      if(isStart){
        ctx.beginPath();
        ctx.moveTo(x-r*0.30,y-r*0.42);ctx.lineTo(x+r*0.48,y);ctx.lineTo(x-r*0.30,y+r*0.42);
        ctx.closePath();ctx.fill();
      }else{
        const s2=r*0.66;ctx.fillRect(x-s2/2,y-s2/2,s2,s2);
      }
    };
    mark(S.start,true);mark(S.end,false);
  }
  // 小人畫在走過/未走過的分界（最上層，仍在地圖 clip 內）
  if(runnerHead){
    drawRunnerCanvas(ctx,X(runnerHead[1]),Y(runnerHead[0]),1.3*sc,light);
  }
  // 8.5) 高程圖圖層（若勾選）。畫在地圖區左下角。
  const elevH = 70 * sc, elevTop = mapH - 90 * sc;
  const elevOn = !!(opt.elevchart && elevChartData);
  if(elevOn){
    drawElevProfileCanvas(ctx, 16 * sc, elevTop, Math.min(420 * sc, mapW - 32 * sc), elevH, light);
  }
  ctx.restore();

  // 9) 比例尺
  const cLat=(Math.min(...lats)+Math.max(...lats))/2;
  const mPerPx=156543.03392*Math.cos(cLat*Math.PI/180)/Math.pow(2,z)/K;
  const NICE=[10,20,50,100,200,500,1000,2000,5000];
  let barM=NICE[0];
  for(const v of NICE) if(v/mPerPx<=mapW*0.3) barM=v;
  // 高程圖也佔左下角，兩個疊在一起會糊成一團 → 有高程圖時比例尺往上讓開
  const barPx=barM/mPerPx, bx=26*sc, tick=6*sc;
  const by=elevOn ? elevTop-20*sc : mapH-26*sc;
  const drawBar=()=>{ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+barPx,by);
    ctx.moveTo(bx,by-tick);ctx.lineTo(bx,by+tick);
    ctx.moveTo(bx+barPx,by-tick);ctx.lineTo(bx+barPx,by+tick);ctx.stroke();};
  ctx.strokeStyle=TH.overlayStroke;ctx.lineWidth=6*sc;drawBar();
  ctx.strokeStyle=TH.overlay;ctx.lineWidth=2.5*sc;drawBar();
  const F='"Microsoft JhengHei","PingFang TC",system-ui,sans-serif';
  ctx.font=`600 ${Math.round(30*sc)}px ${F}`;ctx.textBaseline='alphabetic';ctx.textAlign='center';
  const barTxt=barM>=1000?(barM/1000)+' km':barM+' m';
  const barMid=bx+barPx/2;   // 距離文字置中於線段中間
  ctx.lineWidth=5*sc;ctx.strokeStyle=TH.overlayStroke;
  ctx.strokeText(barTxt,barMid,by-14*sc);
  ctx.fillStyle=TH.overlay;ctx.fillText(barTxt,barMid,by-14*sc);

  // 品牌浮水印（地圖區右下角，不搶焦點）
  ctx.font=`600 ${Math.round(24*sc)}px ${F}`;ctx.textAlign='right';
  ctx.lineWidth=4*sc;ctx.strokeStyle=TH.overlayStroke;
  ctx.strokeText('RUNNING ART',mapW-26*sc,mapH-24*sc);
  ctx.globalAlpha=.92;ctx.fillStyle=TH.overlay;ctx.fillText('RUNNING ART',mapW-26*sc,mapH-24*sc);
  ctx.globalAlpha=1;

  // 10) 地點名稱（中山區, 台北市）—— 反向地理編碼，失敗就留空
  const cLon=(Math.min(...lons)+Math.max(...lons))/2;
  busy('查詢地點…');
  const place=showInfo?await getPlaceName(cLat,cLon):'';

  // 11) 資訊欄：地點+日期一列、開啟的數據一列。數據全關＝整個資訊欄不畫。
  if(showInfo){
    ctx.fillStyle=TH.infoBg;ctx.fillRect(0,mapH,mapW,infoH);
    ctx.fillStyle=TH.infoLine;ctx.fillRect(0,mapH,mapW,Math.max(2,2*sc));
    const pad=36*sc, top=mapH, rowY=top+infoH*0.23;
    ctx.textBaseline='middle';
    let placeX=pad;
    if(place){
      const ph=34*sc;
      drawPin(ctx,pad+ph*0.32,rowY+ph*0.5,ph,'#ef4444');
      placeX=pad+ph*0.9;
      ctx.textAlign='left';ctx.fillStyle=TH.textMain;ctx.font=`600 ${Math.round(37*sc)}px ${F}`;
      ctx.fillText(place,placeX,rowY);
    }
    ctx.textAlign='right';ctx.fillStyle=TH.textDim;ctx.font=`400 ${Math.round(28*sc)}px ${F}`;
    ctx.fillText(localDate(),mapW-pad,rowY);
    // 下排：只畫開啟的數據項（可含吻合度）
    const pm=Math.floor(S.pace), ps=Math.round((S.pace-pm)*60);
    const elevTxt=(S.elevGain!=null)?('↑'+S.elevGain+' ↓'+S.elevLoss+' m'):'–';
    const labelMap={dist:tx('距離','Distance'),pace:tx('配速','Pace'),time:tx('時間','Time'),
                    elev:tx('爬升','Elev.'),fit:tx('吻合度','Match')};
    const valMap={dist:$('sDist').textContent, pace:pm+':'+String(ps).padStart(2,'0')+' /km',
                  time:$('sTime').textContent, elev:elevTxt, fit:$('sFit').textContent};
    const cells=dats.map(d=>[labelMap[d],valMap[d]]);
    const cw=(mapW-pad*2)/cells.length;
    ctx.textAlign='left';
    cells.forEach((c,n)=>{
      const cx=pad+cw*n;
      ctx.fillStyle=TH.textDim;ctx.font=`400 ${Math.round(25*sc)}px ${F}`;
      ctx.fillText(c[0],cx,top+infoH*0.57);
      ctx.fillStyle=TH.textMain;
      let fs=46*sc;ctx.font=`600 ${Math.round(fs)}px ${F}`;
      const maxW=cw-10*sc;
      if(ctx.measureText(c[1]).width>maxW){fs*=maxW/ctx.measureText(c[1]).width;ctx.font=`600 ${Math.round(fs)}px ${F}`;}
      ctx.fillText(c[1],cx,top+infoH*0.81);
    });
  }

  return {canvas:cv, w:W, h:H, tilesFailed};
}

/* canvas → Blob。canvas 若被跨域圖磚污染，toBlob 會丟 SecurityError
   （有些瀏覽器是把 null 傳進 callback），兩種都要當成失敗。 */
function canvasToBlob(cv){
  return new Promise((resolve,reject)=>{
    let done=false;
    try{
      cv.toBlob(b=>{
        if(done) return;
        done=true;
        b?resolve(b):reject(new Error('toBlob returned null'));
      },'image/png');
    }catch(e){ if(!done){ done=true; reject(e); } }
  });
}
/* 真正判斷 canvas 有沒有被污染。只讀 1 個 pixel，成本可忽略，
   而且比等 toBlob 失敗更早、更明確。 */
function canvasIsTainted(cv){
  try{ cv.getContext('2d').getImageData(0,0,1,1); return false; }
  catch(_){ return true; }
}

let _shotUrl='';      // 目前結果對話框正在顯示的 blob: URL
let _shotBlob=null;   // 同一張圖的 Blob，分享用
let _shotName='';
async function exportPNG(opt){
  busy('產生圖片…');
  try{
    let out=await renderExportCanvas(opt);
    let degraded='';

    // 降級 1：底圖污染了 canvas → 拿掉底圖重畫一次，仍然給得出一張純向量 PNG
    if(opt.basemap && canvasIsTainted(out.canvas)){
      busy('底圖受限，改產生無底圖版本…');
      out=await renderExportCanvas(Object.assign({},opt,{basemap:false}));
      degraded=tx('底圖被瀏覽器的跨域限制擋住，已改成無底圖的透明背景版本。',
                  'The base map was blocked by browser cross-origin rules, so this is the transparent no-basemap version.');
    }else if(opt.basemap && out.tilesFailed){
      degraded=tx('底圖圖磚下載失敗（可能是網路問題），路線本身不受影響。',
                  'Base map tiles failed to download (network issue). The route itself is unaffected.');
    }

    let blob;
    try{
      blob=await canvasToBlob(out.canvas);
    }catch(e){
      // 降級 2：toBlob 掛了但畫面沒被污染（記憶體不足等），退回 toDataURL
      let durl='';
      try{ durl=out.canvas.toDataURL('image/png'); }catch(_){}
      if(!durl) throw new Error(tx('這張圖無法轉存，請取消勾選「地圖底圖」後再試一次。',
                                   'This image could not be encoded. Try turning off the base map layer.'));
      blob=await (await fetch(durl)).blob();
    }

    showExportResult(blob,out.w,out.h,degraded);
  }catch(err){
    toast(tx('產生圖片失敗：','Image export failed: ')+err.message,3600);
  }finally{ busy(''); }
}

/* 把成品交給使用者。關鍵是「不在這裡自動觸發下載」：
   非同步結束後的 a.click() 在 Safari／iOS 會被當成非使用者手勢的彈窗而靜默擋掉。
   由使用者按「儲存圖片」，那個 click 才是有效手勢。 */
function showExportResult(blob,w,h,note){
  if(_shotUrl) URL.revokeObjectURL(_shotUrl);
  _shotBlob=blob;
  _shotUrl=URL.createObjectURL(blob);
  _shotName='RunningArt_'+localDate()+'.png';
  $('pngShot').src=_shotUrl;
  const size=w+'×'+h;
  const canShare=!!(navigator.canShare&&navigator.share&&
    (()=>{ try{ return navigator.canShare({files:[new File([blob],_shotName,{type:'image/png'})]}); }
           catch(_){ return false; } })());
  $('pngShare').hidden=!canShare;
  const hints=[size];
  hints.push(canShare?tx('可按「分享」存到相簿，或長按圖片儲存。',
                         'Use Share to save to your photos, or long-press the image.')
                    :tx('手機也可以長按上面的圖片儲存。',
                         'On a phone you can also long-press the image to save it.'));
  if(note) hints.push('⚠ '+note);
  $('pngHint').textContent=hints.join('　·　');
  $('pngResult').hidden=false;
}
function closeExportResult(){
  $('pngResult').hidden=true;
  $('pngShot').removeAttribute('src');
  if(_shotUrl) URL.revokeObjectURL(_shotUrl);
  _shotUrl='';_shotBlob=null;
}
let pngRatio='1:1';
// 匯出對話框的即時預覽：不抓底圖 tile（純色底示意），只即時反映勾選的圖層、
// 比例與跑者進度。真實高畫質底圖在按「產生圖片」時才抓（exportPNG）。
function pngCollectPts(opt){
  const pts=[];
  if(opt.route&&S.result) S.result.segments.forEach(sg=>sg.pts.forEach(p=>pts.push(p)));
  if(opt.draw) S.strokes.forEach(s=>s.pts.forEach(p=>pts.push([p.lat,p.lng])));
  if(!pts.length&&S.result) S.result.segments.forEach(sg=>sg.pts.forEach(p=>pts.push(p)));
  if(opt.marks){ if(S.start)pts.push([S.start.lat,S.start.lng]); if(S.end)pts.push([S.end.lat,S.end.lng]); }
  return pts;
}
// 圖層是「填色多選按鈕」（同比例按鈕樣式），選取＝加上 .on。狀態直接讀 class。
const layerOn=name=>{const b=document.querySelector('.lyr[data-layer="'+name+'"]');return !!(b&&b.classList.contains('on'));};
// 資訊欄數據項也是填色多選按鈕（與圖層區分開）
const datOn=name=>{const b=document.querySelector('.dat[data-dat="'+name+'"]');return b&&b.classList.contains('on')?name:null;};
// 匯出預覽的底圖 tile 快取：同一顆 tile 只抓一次，之後 toggle/拖桿都用快取重畫。
const _tileCache={};
async function loadTileCached(z,x,y,style){
  const k=z+'/'+x+'/'+y+'/'+style;
  if(k in _tileCache) return _tileCache[k];
  const img=await loadTile(z,x,y,(x%4)+(y%4),style);   // 與匯出共用同一套安全載入
  _tileCache[k]=img;
  return img;
}
let _prevToken=0;
async function renderPreview(){
  const cv=$('pngPrev'); if(!cv||!S.result) return;
  const myTok=++_prevToken;
  const opt={route:layerOn('route'),arrows:layerOn('arrows'),draw:layerOn('draw'),
             marks:layerOn('marks'),basemap:layerOn('basemap'),elevchart:layerOn('elevchart'),
             dats:['dist','pace','time','elev','fit'].filter(n=>datOn(n))};
  const frac=+$('pngProg').value/1000;
  const [RW,RH]=PNG_RATIOS[pngRatio]||PNG_RATIOS['1:1'];
  const W=cv.width, scale=W/RW, H=Math.round(RH*scale); cv.height=H;
  const showInfo=opt.dats.length>0, lw=W/1080, light=isLight();
  const infoH=showInfo?INFO_H*scale:0, mapW=W, mapH=H-infoH;
  const TH=light?{mapBg:'#e8ecf1',info:'#ffffff',line:'#dfe4ea',dim:'#cfd4db',tile:'light_all',tileBright:1}
               :{mapBg:'#262a30',info:'#14171c',line:'#2b313b',dim:'#3a4048',tile:'dark_all',tileBright:2.3};
  const ctx=cv.getContext('2d');
  function drawInfoBar(){
    if(!showInfo) return;
    ctx.fillStyle=TH.info;ctx.fillRect(0,mapH,W,infoH);
    ctx.fillStyle=TH.line;ctx.fillRect(0,mapH,W,Math.max(1,infoH*0.012));
    ctx.fillStyle=TH.dim;const pd=infoH*0.16, n=opt.dats.length;
    ctx.fillRect(pd,mapH+infoH*0.26,W*0.42,infoH*0.11);
    for(let i=0;i<n;i++) ctx.fillRect(pd+i*(W-pd*2)/n,mapH+infoH*0.62,(W-pd*2)/n-pd*0.4,infoH*0.16);
  }
  ctx.clearRect(0,0,W,H);
  if(opt.basemap){ ctx.fillStyle=TH.mapBg;ctx.fillRect(0,0,W,mapH); }
  const pts=pngCollectPts(opt);
  if(!pts.length){ drawInfoBar(); return; }
  const lats=pts.map(p=>p[0]),lons=pts.map(p=>p[1]);
  const wx0=lonToWorld(Math.min(...lons),0),wx1=lonToWorld(Math.max(...lons),0);
  const wy0=latToWorld(Math.max(...lats),0),wy1=latToWorld(Math.min(...lats),0);
  const cx=(wx0+wx1)/2,cy=(wy0+wy1)/2;
  const dx=Math.max(wx1-wx0,1e-9)*1.16,dy=Math.max(wy1-wy0,1e-9)*1.16;
  const s=Math.min(mapW/dx,mapH/dy)*0.9;
  const z=Math.max(1,Math.min(19,Math.floor(Math.log2(s)))), K=s/Math.pow(2,z);
  const cxZ=cx*Math.pow(2,z), cyZ=cy*Math.pow(2,z);
  const X=lon=>mapW/2+(lonToWorld(lon,z)-cxZ)*K, Y=lat=>mapH/2+(latToWorld(lat,z)-cyZ)*K;
  // 底圖：basemap 開＝抓真實 tile（快取）、關＝棋盤示意
  if(opt.basemap){
    const tx0=Math.floor((cxZ-(mapW/2)/K)/TILE_SIZE), tx1=Math.floor((cxZ+(mapW/2)/K)/TILE_SIZE);
    const ty0=Math.floor((cyZ-(mapH/2)/K)/TILE_SIZE), ty1=Math.floor((cyZ+(mapH/2)/K)/TILE_SIZE);
    const jobs=[];for(let tx=tx0;tx<=tx1;tx++)for(let ty=ty0;ty<=ty1;ty++)jobs.push({tx,ty});
    const imgs=await Promise.all(jobs.map(j=>loadTileCached(z,j.tx,j.ty,TH.tile)));
    if(myTok!==_prevToken) return;   // 期間有更新的呼叫，放棄這次繪製
    ctx.save();ctx.beginPath();ctx.rect(0,0,mapW,mapH);ctx.clip();
    const ts=TILE_SIZE*K;
    paintTiles(ctx,jobs,imgs,
      j=>({x:mapW/2+(j.tx*TILE_SIZE-cxZ)*K, y:mapH/2+(j.ty*TILE_SIZE-cyZ)*K, w:ts+1, h:ts+1}),
      TH.tileBright);
    ctx.restore();
  }else{
    const gs=Math.max(12,mapW/14);
    for(let yy=0;yy<mapH;yy+=gs)for(let xx=0;xx<mapW;xx+=gs)
      if(((xx/gs|0)+(yy/gs|0))%2){ctx.fillStyle='rgba(128,128,128,.12)';ctx.fillRect(xx,yy,gs,gs);}
  }
  // 向量層
  ctx.save();ctx.beginPath();ctx.rect(0,0,mapW,mapH);ctx.clip();ctx.lineCap=ctx.lineJoin='round';
  if(opt.draw){
    ctx.strokeStyle=light?'#000':'#fff';ctx.lineWidth=(opt.route?15:5)*lw;ctx.globalAlpha=.9;
    S.strokes.forEach(st=>{ctx.beginPath();st.pts.forEach((p,k)=>{const x=X(p.lng),y=Y(p.lat);k?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();});
    ctx.globalAlpha=1;
  }
  let head=null;
  if(opt.route){
    S.result.segments.forEach(sg=>{const draw=sg.kind==='draw';
      ctx.strokeStyle=draw?'#708090':'#cbd5e1';ctx.lineWidth=(draw?10.5:2.5)*lw;
      ctx.setLineDash(draw?[]:[10*lw,9*lw]);ctx.beginPath();
      sg.pts.forEach((p,k)=>{const x=X(p[1]),y=Y(p[0]);k?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();});
    ctx.setLineDash([]);
    if(S.path&&S.path.length>1&&S.totalM>0&&frac>0){
      const target=S.totalM*frac;let lo=0,hi=S.cum.length-1;
      while(lo<hi){const mm=(lo+hi)>>1;S.cum[mm]<target?lo=mm+1:hi=mm;}
      const idx=lo;const shown=S.path.slice(0,Math.max(idx+1,1)).map(p=>[p[0],p[1]]);
      head=S.path[Math.max(idx,0)];
      if(idx>0){const seg=S.cum[idx]-S.cum[idx-1],t=seg>0?(target-S.cum[idx-1])/seg:0,a=S.path[idx-1],b=S.path[idx];
        head=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];shown[shown.length-1]=head;}
      ctx.strokeStyle='#4169E1';ctx.lineWidth=8*lw;ctx.beginPath();
      shown.forEach((p,k)=>{const x=X(p[1]),y=Y(p[0]);k?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
      if(frac>=1) head=null;
    }
  }
  if(opt.arrows && S.path && S.path.length >= 2 && S.totalM > 0){
    const curD = S.totalM * (frac || 0);
    const step = 200;
    for(let targetD = step; targetD < S.totalM - 20; targetD += step){
      if(targetD <= curD) continue;   // 已走過路段不顯示箭頭
      const i = pvIndexAt(targetD);
      if(i < 1) continue;
      const a = S.path[i-1], b = S.path[i];
      const segLen = S.cum[i] - S.cum[i-1];
      if(segLen < 30) continue;   // 兩節點小於 30m 跳過
      const mid = [(a[0] + b[0])/2, (a[1] + b[1])/2];
      const ax = X(a[1]), ay = Y(a[0]), bx = X(b[1]), by = Y(b[0]);
      if(ax === bx && ay === by) continue;
      ctx.save();
      ctx.translate(X(mid[1]), Y(mid[0]));
      ctx.rotate(Math.atan2(by - ay, bx - ax));
      drawChevron(ctx, Math.max(4, 6 * lw));
      ctx.restore();
    }
  }
  if(opt.marks){
    const mk=(ll,isStart)=>{if(!ll)return;const x=X(ll.lng),y=Y(ll.lat),r=15*lw;
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=isStart?'#16a34a':'#dc2626';ctx.fill();
      ctx.lineWidth=3*lw;ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#fff';
      if(isStart){ctx.beginPath();ctx.moveTo(x-r*0.30,y-r*0.42);ctx.lineTo(x+r*0.48,y);ctx.lineTo(x-r*0.30,y+r*0.42);ctx.closePath();ctx.fill();}
      else{const s2=r*0.66;ctx.fillRect(x-s2/2,y-s2/2,s2,s2);}};
    mk(S.start,true);mk(S.end,false);
  }
  if(head) drawRunnerCanvas(ctx,X(head[1]),Y(head[0]),1.3*lw,light);
  // 用和匯出完全相同的常數（只差縮放係數），預覽才真的等於成品
  if(opt.elevchart && elevChartData){
    drawElevProfileCanvas(ctx, 16 * lw, mapH - 90 * lw, Math.min(420 * lw, mapW - 32 * lw), 70 * lw, light);
  }
  ctx.restore();
  drawInfoBar();
}
function drawElevProfileCanvas(ctx, x, y, w, h, light){
  if(!elevChartData || !elevChartData.elevations || elevChartData.elevations.length < 2) return;
  const elevations = elevChartData.elevations;
  let minE = Infinity, maxE = -Infinity;
  elevations.forEach(e => {
    if(e < minE) minE = e;
    if(e > maxE) maxE = e;
  });
  const rangeE = Math.max(10, maxE - minE);

  ctx.save();
  ctx.translate(x, y);

  /* 內部尺寸全部跟著方框高度縮放（u=1 對應匯出時的 70px 高）。
     以前是寫死的 10px 字 / 2.2px 線寬，所以同一份程式在 1080px 的匯出圖上細如髮絲、
     在 300px 的預覽縮圖上又大得爆框。 */
  const u = h / 70;

  ctx.fillStyle = light ? 'rgba(255,255,255,0.85)' : 'rgba(20,23,28,0.85)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(0, 0, w, h, 8 * u);
  else ctx.rect(0, 0, w, h);
  ctx.fill();

  const padL = 10 * u, padR = 10 * u, padT = 16 * u, padB = 8 * u;
  const chartW = w - padL - padR, chartH = h - padT - padB;

  ctx.beginPath();
  elevations.forEach((e, idx) => {
    const px = padL + (idx / (elevations.length - 1)) * chartW;
    const py = padT + chartH - ((e - minE) / rangeE) * chartH;
    if(idx === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  });

  ctx.strokeStyle = '#00E5FF';
  ctx.lineWidth = Math.max(0.6, 2.2 * u);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.lineTo(w - padR, padT + chartH);
  ctx.lineTo(padL, padT + chartH);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, padT, 0, padT + chartH);
  grad.addColorStop(0, 'rgba(0, 229, 255, 0.4)');
  grad.addColorStop(1, 'rgba(0, 229, 255, 0.02)');
  ctx.fillStyle = grad;
  ctx.fill();

  // 兩個標籤都靠 padT 上方那條帶子，右邊那個用 textAlign 收邊，避免寬度寫死而被裁掉
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#00E5FF';
  ctx.font = `bold ${Math.max(6, 10 * u)}px sans-serif`;
  ctx.fillText(`▲ ${Math.round(maxE)}m`, padL, padT - 3 * u);

  ctx.fillStyle = light ? '#64748b' : '#94a3b8';
  ctx.font = `600 ${Math.max(6, 9 * u)}px sans-serif`;
  ctx.textAlign = 'right';
  ctx.fillText(`▼ ${Math.round(minE)}m`, w - padR, padT - 3 * u);

  ctx.restore();
}
document.querySelectorAll('.rt[data-ratio]').forEach(b=>b.onclick=()=>{
  pngRatio=b.dataset.ratio;
  document.querySelectorAll('.rt[data-ratio]').forEach(x=>x.classList.toggle('on',x===b));
  renderPreview();
});
document.querySelectorAll('.lyr').forEach(b=>b.onclick=()=>{b.classList.toggle('on');renderPreview();});
document.querySelectorAll('.dat').forEach(b=>b.onclick=()=>{b.classList.toggle('on');renderPreview();});
$('pngProg').oninput=()=>{
  const pct=+$('pngProg').value/10;
  $('pngProgTxt').textContent=Math.round(pct)+'%';
  $('pngProg').style.background=`linear-gradient(to right,#4169E1 0%,#4169E1 ${pct}%,#708090 ${pct}%,#708090 100%)`;
  renderPreview();
};
$('aPng').onclick=()=>{
  if(!S.result) return;
  $('pngModal').hidden=false;
  // 進度預設跟隨結果面板當前的拉桿位置
  $('pngProg').value=(typeof S.totalM==='number'&&S.totalM>0)?(+$('pvSlider').value||1000):1000;
  $('pngProg').dispatchEvent(new Event('input'));   // 更新百分比文字、拉桿底色、預覽
};
$('pngCancel').onclick=()=>{ $('pngModal').hidden=true; };
$('pngGo').onclick=()=>{
  $('pngModal').hidden=true;
  exportPNG({ratio:pngRatio,route:layerOn('route'),arrows:layerOn('arrows'),draw:layerOn('draw'),
             marks:layerOn('marks'),basemap:layerOn('basemap'),elevchart:layerOn('elevchart'),
             dats:['dist','pace','time','elev','fit'].filter(n=>datOn(n)),
             frac:+$('pngProg').value/1000});
};
$('pngClose').onclick=closeExportResult;
// 這個 click 本身就是使用者手勢，所以 a.click() 不會被 Safari 的彈窗攔截器擋掉
$('pngSave').onclick=()=>{
  if(!_shotUrl) return;
  const a=document.createElement('a');
  a.href=_shotUrl;a.download=_shotName;
  document.body.appendChild(a);a.click();a.remove();
  toast(tx('圖片已儲存','Image saved'),2000);
};
// iOS 上「分享」才是存進相簿的正規路徑，比下載到「檔案」好用
$('pngShare').onclick=async()=>{
  if(!_shotBlob) return;
  try{
    await navigator.share({files:[new File([_shotBlob],_shotName,{type:'image/png'})],
                           title:'Running Art'});
  }catch(e){
    if(e&&e.name==='AbortError') return;   // 使用者自己取消分享，不是錯誤
    toast(tx('分享失敗，請改用「儲存圖片」或長按圖片。',
             'Share failed — use Save image or long-press the image.'),3000);
  }
};
// 點對話框外的暗色區域＝關閉
$('pngResult').onclick=e=>{ if(e.target===$('pngResult')) closeExportResult(); };
$('pngModal').onclick=e=>{ if(e.target===$('pngModal')) $('pngModal').hidden=true; };

el.sheet.querySelector('.grip').onclick=()=>{S.sheetUp=false;el.sheet.classList.remove('up');refresh();};
el.pill.onclick=()=>{
  if(!S.result||S.sheetUp||S.editing) return;
  S.sheetUp=true;el.sheet.classList.add('up');refresh();fitRoute();
};

function busy(t){const b=$('busy');
  if(t){if(EN()&&PROG_EN[t]) t=PROG_EN[t]; $('busyTxt').textContent=t;b.classList.add('on');}
  else b.classList.remove('on');}
Engine.setProgress(busy);
Engine.boot().then(()=>toast('運算引擎已就緒')).catch(e=>toast(tx('引擎載入失敗：','Engine load failed: ')+e.message,3000));

applyLang();
setMode('pan');guide();refresh();
</script>
